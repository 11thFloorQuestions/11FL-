<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Games - Promo Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --accent-red: #ff1f2d;
            --accent-red-glow: rgba(255, 31, 45, 0.25);
            --accent-green: #84CC16;
            --accent-green-glow: rgba(132, 204, 22, 0.35);
            --text-primary: #ffffff;
            --text-muted: #888888;

            /* Game Genre Colors matching Lobby */
            --color-terrace: #84CC16;
            --color-terrace-glow: rgba(132, 204, 22, 0.35);
            --color-questions: #D4AF37;
            --color-wordclimb: #3B82F6;
            --color-clusters: #ff751f;
            --color-cluegram: #cc007e;
            --color-parity: #ff9999;

            --genre-terrace: #84CC16;
            --genre-terrace-glow: rgba(132, 204, 22, 0.3);
            --state-active: #facc15;
            --state-success: #22c55e;
            --state-error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Strict 9:16 Mobile Vertical Frame for Screen Recording */
        .promo-canvas {
            width: 360px;
            height: 640px;
            background-color: var(--bg-deep);
            border: 2px solid var(--surface-border);
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 12px 8px 12px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* Lobby Logo Block with Slow Color Cycle */
        .promo-hub-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
            flex-shrink: 0;
        }

        .promo-hub-logo-red {
            font-family: 'Anton', sans-serif;
            font-size: 2.5rem;
            font-weight: 400;
            color: var(--accent-red);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 31, 45, 0.35);
            margin-bottom: 2px;
            animation: logoColorCycle 8s ease-in-out infinite;
        }

        .promo-hub-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 1px;
        }

        .promo-hub-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.55rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 2px;
        }

        .promo-presents {
            font-size: 0.5rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-green);
        }

        .promo-game-title {
            font-family: 'Anton', sans-serif;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            color: #ffffff;
            margin-top: 1px;
        }

        /* Scaled Down Mock Mobile Viewport Container */
        .promo-mock-device {
            width: 200px;
            height: 270px;
            background-color: var(--surface);
            border: 1.5px solid var(--surface-border);
            border-radius: 8px;
            position: relative;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.8);
            z-index: 5;
            flex-shrink: 0;
        }

        /* Scaled Embedded Gameplay Frame */
        .promo-game-viewport {
            width: 320px;
            height: 432px;
            transform: scale(0.625);
            transform-origin: center center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            pointer-events: none;
        }

        /* Dedicated Non-Overlapping Text Area */
        .promo-body {
            height: 75px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 20;
            position: relative;
            flex-shrink: 0;
        }

        .promo-text {
            font-family: 'Impact', sans-serif;
            font-size: 1.35rem;
            font-weight: normal;
            letter-spacing: 0.5px;
            line-height: 1.15;
            color: #ffffff;
            opacity: 0;
            transform: translateY(6px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            position: absolute;
            width: 100%;
            padding: 0 8px;
            text-shadow: 2px 2px 6px rgba(0,0,0,0.9);
        }

        .promo-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        .promo-text .highlight {
            color: var(--accent-green);
            text-shadow: 0 0 10px var(--accent-green-glow), 2px 2px 4px rgba(0,0,0,0.9);
        }

        .promo-text .pop {
            display: inline-block;
            transform: scale(1.08);
            color: var(--accent-red);
            text-shadow: 0 0 12px var(--accent-red-glow), 2px 2px 4px rgba(0,0,0,0.9);
        }

        /* Clean Bottom Footer */
        .promo-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10;
            flex-shrink: 0;
            padding-bottom: 2px;
        }

        .promo-footer-text {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
        }

        /* Inline TYKB Mini Styles */
        .hud-sidebar-container { width: 100%; display: flex; align-items: stretch; gap: 8px; margin-bottom: 4px; flex-shrink: 0; }
        .tower-stack { display: flex; flex-direction: column; gap: 2px; width: 36px; background: var(--surface); border: 1px solid var(--surface-border); border-radius: 6px; padding: 4px; justify-content: space-between; flex-shrink: 0; }
        .tower-floor { height: 5px; border: 1px solid var(--surface-border); background: #111111; transition: all 0.2s ease; border-radius: 1px; }
        .tower-floor.active { border-color: var(--state-active); background: var(--state-active); box-shadow: 0 0 6px rgba(250, 204, 21, 0.3); }
        .tower-floor.completed { border-color: var(--state-success); background: var(--state-success); box-shadow: 0 0 4px rgba(34, 197, 94, 0.3); }
        .tower-floor.failed { border-color: var(--state-error); background: var(--state-error); box-shadow: 0 0 4px rgba(239, 68, 68, 0.3); }

        .floor-info-box {
            flex-grow: 1;
            background-color: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 6px 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        .floor-left-group { display: flex; flex-direction: column; gap: 2px; z-index: 1; }
        .current-floor-display { font-family: 'Montserrat', sans-serif; font-size: 0.85rem; font-weight: 800; letter-spacing: 0.5px; }
        .floor-rule-text { font-family: 'Montserrat', sans-serif; font-size: 0.55rem; font-weight: 600; color: var(--text-muted); letter-spacing: 0.5px; text-transform: uppercase; }

        .play-card {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 10px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-grow: 1;
            overflow: hidden;
        }

        .timer-track { width: 100%; height: 3px; background: #111111; border-radius: 2px; overflow: hidden; }
        .timer-fill { height: 100%; background: var(--state-active); width: 100%; transition: width 0.05s linear; }
        
        .question-box {
            width: 100%;
            background: #111111;
            border: 1px solid var(--surface-border);
            border-radius: 4px;
            padding: 8px 10px;
            text-align: center;
        }

        .question-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            color: #ffffff;
            line-height: 1.25;
        }

        .options-grid { width: 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
        .btn-option { width: 100%; min-height: 36px; background: #111111; border: 1px solid rgba(250, 204, 21, 0.4); border-radius: 6px; color: #ffffff; font-family: 'Montserrat', sans-serif; font-size: 0.65rem; font-weight: 700; padding: 4px 6px; display: flex; align-items: center; justify-content: center; text-align: center; }

        /* Slow, smooth color cycle */
        @keyframes logoColorCycle {
            0%   { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.35); }
            14%  { color: var(--color-terrace); text-shadow: 0 0 20px var(--color-terrace-glow); }
            28%  { color: var(--color-cluegram); text-shadow: 0 0 20px rgba(204, 0, 126, 0.35); }
            42%  { color: var(--color-questions); text-shadow: 0 0 20px rgba(212, 175, 55, 0.35); }
            56%  { color: var(--color-wordclimb); text-shadow: 0 0 20px rgba(59, 130, 246, 0.35); }
            70%  { color: var(--color-clusters); text-shadow: 0 0 20px rgba(255, 117, 31, 0.35); }
            84%  { color: var(--color-parity); text-shadow: 0 0 20px rgba(255, 153, 153, 0.35); }
            100% { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.35); }
        }
    </style>
</head>
<body>

    <div class="promo-canvas">
        <!-- Lobby Logo Block -->
        <div class="promo-hub-logo-box">
            <h1 class="promo-hub-logo-red">11FL?</h1>
            <p class="promo-hub-logo-title">Eleventh Floor</p>
            <p class="promo-hub-logo-sub">GAMES LOBBY</p>
            <div class="promo-presents">PRESENTS</div>
            <div class="promo-game-title" id="brand-game-title">Think You Know Ball?</div>
        </div>

        <!-- Mock Mobile Frame for Game Playback -->
        <div class="promo-mock-device">
            <div class="promo-game-viewport">
                <!-- Gameplay HUD Header -->
                <div class="hud-sidebar-container">
                    <div class="tower-stack">
                        <div class="tower-floor" data-floor="11"></div>
                        <div class="tower-floor" data-floor="10"></div>
                        <div class="tower-floor" data-floor="9"></div>
                        <div class="tower-floor" data-floor="8"></div>
                        <div class="tower-floor" data-floor="7"></div>
                        <div class="tower-floor" data-floor="6"></div>
                        <div class="tower-floor" data-floor="5"></div>
                        <div class="tower-floor" data-floor="4"></div>
                        <div class="tower-floor" data-floor="3"></div>
                        <div class="tower-floor" data-floor="2"></div>
                        <div class="tower-floor" data-floor="1"></div>
                    </div>

                    <div class="floor-info-box">
                        <div class="floor-left-group">
                            <div class="current-floor-display" id="card-floor-text"><span style="color: var(--genre-terrace); font-weight: 800;">1st</span> <span style="color: #ffffff;">Floor</span></div>
                            <div class="floor-rule-text" id="floor-rule-text">No mistakes!</div>
                        </div>
                    </div>
                </div>

                <!-- Game Screen Workspace -->
                <div class="play-card">
                    <div class="timer-track"><div id="timer-bar" class="timer-fill"></div></div>
                    
                    <div class="question-box">
                        <div id="question-text" class="question-text">Loading question...</div>
                    </div>

                    <div class="options-grid">
                        <button class="btn-option"></button>
                        <button class="btn-option"></button>
                        <button class="btn-option"></button>
                        <button class="btn-option"></button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Dedicated Non-Overlapping Dynamic Impact Script Area -->
        <div class="promo-body">
            <div id="text-slot" class="promo-text"></div>
        </div>

        <!-- Clean Footer Text -->
        <div class="promo-footer">
            <span class="promo-footer-text">New Game Everyday at 11am UK</span>
        </div>
    </div>

    <script>
        /* ==========================================================================
           MODULAR CONFIGURATION: Switch game settings easily
           ========================================================================== */
        const gameConfig = {
            title: "Think You Know Ball?",
            accentColor: "#84CC16",
            glowColor: "rgba(132, 204, 22, 0.35)"
        };

        document.documentElement.style.setProperty('--accent-green', gameConfig.accentColor);
        document.documentElement.style.setProperty('--accent-green-glow', gameConfig.glowColor);
        document.getElementById('brand-game-title').innerText = gameConfig.title;

        /* ==========================================================================
           PROMO SCRIPT SEQUENCE (Impact Font, Clean Non-Overlapping Flow)
           ========================================================================== */
        const sequence = [
            { text: "STOP WASTING YOUR TIME ON <span class='highlight'>AI SLOP</span> FOOTBALL QUIZZES.", duration: 2200 },
            { text: "EVERY QUESTION IS FACT-CHECKED BY A <span class='highlight'>REAL HUMAN</span>.", duration: 2200 },
            { text: "THINK YOU KNOW BALL?<br><span class='pop'>YOU DON'T!</span>", duration: 2500 }
        ];

        let currentIndex = 0;
        const textSlot = document.getElementById('text-slot');

        function runPromo() {
            if (currentIndex >= sequence.length) {
                currentIndex = 0;
            }

            const currentItem = sequence[currentIndex];
            textSlot.innerHTML = currentItem.text;
            textSlot.classList.add('active');

            setTimeout(() => {
                textSlot.classList.remove('active');
                setTimeout(() => {
                    currentIndex++;
                    runPromo();
                }, 300);
            }, currentItem.duration);
        }

        /* ==========================================================================
           GAME SIMULATION LOOP FOR PROMO DISPLAY
           ========================================================================== */
        const sampleQuestions = [
            { question: "Which club won the inaugural Premier League title in 1992-93?", options: ["Manchester United", "Blackburn Rovers", "Arsenal", "Aston Villa"], answer: "Manchester United" },
            { question: "Who holds the record for most goals in a single 38-game Premier League season?", options: ["Erling Haaland", "Alan Shearer", "Mohamed Salah", "Thierry Henry"], answer: "Erling Haaland" },
            { question: "Which player has accumulated the most overall appearances in PL history?", options: ["Gareth Barry", "Ryan Giggs", "James Milner", "Frank Lampard"], answer: "Gareth Barry" }
        ];

        let qIndex = 0;
        function updateMockGameplay() {
            const q = sampleQuestions[qIndex % sampleQuestions.length];
            document.getElementById('question-text').textContent = q.question;
            const btns = document.querySelectorAll('.options-grid .btn-option');
            btns.forEach((btn, idx) => {
                btn.textContent = q.options[idx] || '';
            });
            qIndex++;
        }

        window.onload = () => {
            updateMockGameplay();
            setInterval(updateMockGameplay, 4000);
            setTimeout(runPromo, 500);
        };
    </script>
</body>
</html>
