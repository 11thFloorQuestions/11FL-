<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Think You Know Ball? — Promo Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --genre-terrace: #84CC16;
            --genre-terrace-glow: rgba(132, 204, 22, 0.3);
            --text-primary: #ffffff;
            --text-muted: #888888;
            --state-error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Strict 9:16 Mobile Vertical Frame for Screen Recording */
        .promo-canvas {
            width: 360px;
            height: 640px;
            background-color: var(--bg-deep);
            border: 2px solid var(--surface-border);
            border-radius: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 24px 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.9);
            overflow: hidden;
        }

        /* Clean Circular Brand Emblem Header */
        .promo-emblem {
            width: 72px;
            height: 72px;
            background: var(--surface);
            border: 2px solid var(--genre-terrace);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 16px var(--genre-terrace-glow);
            margin-bottom: 4px;
        }

        .promo-emblem-text {
            font-family: 'Anton', sans-serif;
            font-size: 1.8rem;
            color: var(--genre-terrace);
            line-height: 1;
        }

        .promo-brand-title {
            font-size: 0.65rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 2px;
        }

        .promo-game-name {
            font-family: 'Anton', sans-serif;
            font-size: 1.15rem;
            letter-spacing: 0.5px;
            color: #ffffff;
            text-transform: uppercase;
        }

        /* Mock Mobile Device Frame for Game Flow */
        .promo-mock-device {
            width: 280px;
            height: 340px;
            background-color: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        /* Simulated mini HUD & gameplay inside mock device */
        .mock-tower-bar {
            width: 100%;
            display: flex;
            gap: 2px;
            height: 6px;
            margin-bottom: 10px;
        }

        .mock-floor {
            flex: 1;
            background: #111111;
            border-radius: 1px;
            border: 1px solid var(--surface-border);
        }

        .mock-floor.active {
            background: var(--genre-terrace);
            border-color: var(--genre-terrace);
            box-shadow: 0 0 6px var(--genre-terrace-glow);
        }

        .mock-question-box {
            width: 100%;
            background: #111111;
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 10px;
            font-size: 0.75rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 10px;
            line-height: 1.3;
        }

        .mock-options {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
        }

        .mock-opt {
            background: #111111;
            border: 1px solid var(--surface-border);
            border-radius: 4px;
            padding: 8px 4px;
            font-size: 0.65rem;
            font-weight: 700;
            text-align: center;
            color: #ffffff;
        }

        .mock-opt.correct {
            border-color: var(--genre-terrace);
            background: rgba(132, 204, 22, 0.2);
            color: #bbf7d0;
        }

        /* Dynamic Impact Script Overlay */
        .promo-body {
            position: absolute;
            top: 48%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 88%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            z-index: 20;
            pointer-events: none;
        }

        .promo-text {
            font-family: 'Impact', sans-serif;
            font-size: 2.2rem;
            font-weight: normal;
            letter-spacing: 1px;
            line-height: 1.2;
            color: #ffffff;
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.25s ease, transform 0.25s ease;
            position: absolute;
            width: 100%;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.95), -2px -2px 8px rgba(0,0,0,0.95), 0 0 12px rgba(0,0,0,0.9);
        }

        .promo-text.active {
            opacity: 1;
            transform: translateY(0);
        }

        .promo-text .highlight {
            color: var(--genre-terrace);
            text-shadow: 0 0 12px var(--genre-terrace-glow), 2px 2px 6px rgba(0,0,0,0.95);
        }

        .promo-text .pop {
            display: inline-block;
            transform: scale(1.12);
            color: var(--state-error);
            text-shadow: 0 0 16px rgba(239, 68, 68, 0.4), 2px 2px 6px rgba(0,0,0,0.95);
        }

        /* Clean Footer */
        .promo-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            z-index: 10;
            padding-bottom: 2px;
        }

        .promo-footer-text {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="promo-canvas">
        <!-- Clean Brand Emblem Header -->
        <div style="display: flex; flex-direction: column; align-items: center;">
            <div class="promo-emblem">
                <span class="promo-emblem-text">?</span>
            </div>
            <span class="promo-brand-title">11th Floor Games</span>
            <h1 class="promo-game-name">Think You Know Ball?</h1>
        </div>

        <!-- Mock Device Frame displaying game aesthetic -->
        <div class="promo-mock-device">
            <div class="mock-tower-bar">
                <div class="mock-floor active"></div>
                <div class="mock-floor"></div>
                <div class="mock-floor"></div>
                <div class="mock-floor"></div>
                <div class="mock-floor"></div>
                <div class="mock-floor"></div>
                <div class="mock-floor"></div>
                <div class="mock-floor"></div>
                <div class="mock-floor"></div>
                <div class="mock-floor"></div>
                <div class="mock-floor"></div>
            </div>
            <div class="mock-question-box">
                Which club became the first team to defeat Pep Guardiola's Manchester City in the Premier League during their 'Centurions' 2017–18 campaign?
            </div>
            <div class="mock-options">
                <div class="mock-opt correct">Liverpool</div>
                <div class="mock-opt">Manchester United</div>
                <div class="mock-opt">Tottenham Hotspur</div>
                <div class="mock-opt">Chelsea</div>
            </div>
        </div>

        <!-- Dynamic Impact Script Overlay -->
        <div class="promo-body">
            <div id="text-slot" class="promo-text"></div>
        </div>

        <!-- Clean Footer -->
        <div class="promo-footer">
            <span class="promo-footer-text">New Game Everyday at 11am UK</span>
        </div>
    </div>

    <script>
        const sequence = [
            { text: "STOP WASTING YOUR TIME ON <span class='highlight'>AI SLOP</span> FOOTBALL QUIZZES.", duration: 2000 },
            { text: "EVERY QUESTION IS FACT-CHECKED BY A <span class='highlight'>REAL HUMAN</span>.", duration: 2000 },
            { text: "THINK YOU KNOW BALL?<br><span class='pop'>YOU DON'T!</span>", duration: 2500 }
        ];

        let currentIndex = 0;
        const textSlot = document.getElementById('text-slot');

        function runPromo() {
            if (currentIndex >= sequence.length) {
                currentIndex = 0;
            }

            const currentItem = sequence[currentIndex];
            textSlot.innerHTML = currentItem.text;
            textSlot.classList.add('active');

            setTimeout(() => {
                textSlot.classList.remove('active');
                setTimeout(() => {
                    currentIndex++;
                    runPromo();
                }, 300);
            }, currentItem.duration);
        }

        window.onload = () => {
            setTimeout(runPromo, 500);
        };
    </script>
</body>
</html>
