<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleventh Floor Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
        }
        .hub-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }
        .hub-logo-red {
            font-size: 6.5rem;
            font-weight: 900;
            color: #ff0000;
            line-height: 0.9;
            letter-spacing: -2px;
        }
        .hub-logo-title {
            font-size: 2.2rem;
            font-weight: 300;
            color: #ffffff;
            margin-top: 10px;
            letter-spacing: 1px;
        }
        .hub-logo-sub {
            font-size: 1.1rem;
            font-weight: 600;
            color: #ffffff;
            letter-spacing: 5px;
            margin-top: 6px;
            text-transform: uppercase;
        }
        .hub-menu-box {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
            max-width: 320px;
        }
        .btn-hub-option {
            display: block;
            background-color: transparent;
            border: 2px solid #ffffff;
            color: #ffffff;
            padding: 16px 20px;
            font-size: 1.1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.2s ease-in-out;
            text-transform: uppercase;
        }
        .btn-hub-option:hover {
            background-color: #ffffff;
            color: #000000;
        }
        .btn-disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .btn-disabled:hover {
            background-color: transparent;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="hub-logo-box">
        <h1 class="hub-logo-red">11FL?</h1>
        <p class="hub-logo-title">Eleventh Floor</p>
        <p class="hub-logo-sub">GAMES</p>
    </div>

    <div class="hub-menu-box">
        <a href="index.html" class="btn-hub-option">11th Floor Questions</a>
        <a href="#" class="btn-hub-option btn-disabled" onclick="alert('11th Floor Word Climb is coming soon!'); return false;">11th Floor Word Climb</a>
    </div>

</body>
</html>
