<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eleventh Floor Games — Yesterday's Answers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-card: #111111;
            --surface-border: #222222;
            --surface-border-light: #333333;
            --accent-red: #ff1f2d;
            --text-primary: #ffffff;
            --text-muted: #888888;

            /* Specific Game Genre Colors matching Lobby */
            --color-terrace: #84CC16;
            --color-terrace-glow: rgba(132, 204, 22, 0.35);
            --color-questions: #D4AF37;
            --color-questions-glow: rgba(212, 175, 55, 0.35);
            --color-wordclimb: #3B82F6;
            --color-wordclimb-glow: rgba(59, 130, 246, 0.35);
            --color-clusters: #ff751f;
            --color-clusters-glow: rgba(255, 117, 31, 0.35);
            --color-cluegram: #cc007e;
            --color-cluegram-glow: rgba(204, 0, 126, 0.35);
            --color-parity: #ff9999;
            --color-parity-glow: rgba(255, 153, 153, 0.35);

            --current-accent: var(--color-terrace);
            --current-glow: var(--color-terrace-glow);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 32px 12px;
        }

        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 8px;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--current-accent);
            color: var(--current-accent);
        }

        /* Container Frame */
        .archive-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Scaled Logo Box matching index.html */
        .hub-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 4px;
        }

        .hub-logo-red {
            font-family: 'Anton', sans-serif;
            font-size: 3.8rem;
            font-weight: 400;
            color: var(--accent-red);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 31, 45, 0.35);
            margin-bottom: 4px;
            animation: logoColorCycle 8s ease-in-out infinite;
        }

        .hub-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.1rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .hub-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        @keyframes logoColorCycle {
            0%   { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.35); }
            14%  { color: var(--color-terrace); text-shadow: 0 0 20px var(--color-terrace-glow); }
            28%  { color: var(--color-cluegram); text-shadow: 0 0 20px var(--color-cluegram-glow); }
            42%  { color: var(--color-questions); text-shadow: 0 0 20px var(--color-questions-glow); }
            56%  { color: var(--color-wordclimb); text-shadow: 0 0 20px var(--color-wordclimb-glow); }
            70%  { color: var(--color-clusters); text-shadow: 0 0 20px var(--color-clusters-glow); }
            84%  { color: var(--color-parity); text-shadow: 0 0 20px var(--color-parity-glow); }
            100% { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.35); }
        }

        /* Game Switcher Tabs */
        .game-tabs-scroll {
            width: 100%;
            overflow-x: auto;
            display: flex;
            gap: 8px;
            padding: 4px 0;
            scrollbar-width: none;
        }

        .game-tabs-scroll::-webkit-scrollbar {
            display: none;
        }

        .tab-btn {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 8px 12px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: #ffffff;
            border-color: var(--current-accent);
            box-shadow: 0 0 10px var(--current-glow);
            background: #161616;
        }

        /* Set Metadata Box */
        .set-meta-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .set-title-text {
            font-size: 0.85rem;
            font-weight: 800;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .set-date-badge {
            font-size: 0.6rem;
            font-weight: 700;
            background: #222222;
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Answers Display Zone */
        .answers-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .floor-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            overflow: hidden;
        }

        .floor-card-header {
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #141414;
            border-bottom: 1px solid #1a1a1a;
        }

        .floor-number-badge {
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            color: var(--current-accent);
            letter-spacing: 0.5px;
        }

        .floor-type-tag {
            font-size: 0.55rem;
            font-weight: 800;
            color: var(--text-muted);
            background: #000000;
            border: 1px solid #222222;
            padding: 3px 6px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .floor-card-body {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .q-text {
            font-size: 0.78rem;
            font-weight: 600;
            line-height: 1.35;
            color: #ffffff;
        }

        /* Option Chips */
        .options-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 4px;
        }

        .opt-chip {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 8px;
            border-radius: 5px;
            background: #0a0a0a;
            border: 1px solid #222222;
            color: var(--text-muted);
            text-align: center;
        }

        .opt-chip.correct-chip {
            background: rgba(34, 197, 94, 0.15);
            border-color: #22c55e;
            color: #86EFAC;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.2);
        }

        .opt-chip.trap-chip {
            background: rgba(239, 68, 68, 0.15);
            border-color: #ef4444;
            color: #FCA5A5;
        }

        /* Word Climb Matrix Layout */
        .wheel-letters-row {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            margin: 4px 0;
        }

        .letter-bubble {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #161616;
            border: 1px solid var(--surface-border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-weight: 800;
            font-size: 0.8rem;
            color: #ffffff;
        }

        .letter-bubble.center-key {
            background: var(--color-wordclimb);
            color: #000000;
            border-color: var(--color-wordclimb);
            box-shadow: 0 0 8px var(--color-wordclimb-glow);
        }

        .word-matrix-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        /* Cluster Boxes */
        .cluster-group-box {
            background: #080808;
            border: 1px solid #1f1f1f;
            border-radius: 6px;
            padding: 8px 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .cluster-cat-title {
            font-size: 0.62rem;
            font-weight: 800;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .cluster-words-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* Terrace Fact Box */
        .fact-box {
            background: #080808;
            border-left: 3px solid var(--current-accent);
            padding: 10px;
            border-radius: 0 6px 6px 0;
            margin-top: 4px;
        }

        .fact-title {
            font-size: 0.55rem;
            font-weight: 800;
            color: var(--current-accent);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .fact-text {
            font-size: 0.68rem;
            font-weight: 500;
            color: #cccccc;
            line-height: 1.35;
        }

        .anchor-tag {
            display: inline-block;
            margin-top: 6px;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--text-muted);
            background: #141414;
            padding: 2px 6px;
            border-radius: 3px;
        }

        /* Affiliate Card */
        .promo-affiliate-card {
            background: linear-gradient(135deg, #141414 0%, #0a0a0a 100%);
            border: 1px solid var(--current-accent);
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            text-align: center;
            box-shadow: 0 0 15px var(--current-glow);
            margin-top: 8px;
        }

        .affiliate-badge {
            font-size: 0.5rem;
            font-weight: 800;
            letter-spacing: 1.5px;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .affiliate-title {
            font-family: 'Anton', sans-serif;
            font-size: 1.1rem;
            color: #ffffff;
            text-transform: uppercase;
        }

        .affiliate-desc {
            font-size: 0.68rem;
            color: var(--text-muted);
            line-height: 1.3;
        }

        .affiliate-btn {
            background: var(--current-accent);
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 800;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            transition: transform 0.15s ease;
        }

        .affiliate-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="archive-container">
        <div class="top-bar">
            <a href="index.html" class="pill-btn">← LOBBY</a>
        </div>

        <!-- Scaled Logo Box matching index.html -->
        <div class="hub-logo-box">
            <h1 class="hub-logo-red">11FL?</h1>
            <p class="hub-logo-title">Eleventh Floor</p>
            <p class="hub-logo-sub">YESTERDAY'S ANSWERS</p>
        </div>

        <!-- Horizontal Game Switcher Tabs -->
        <div class="game-tabs-scroll">
            <button class="tab-btn active" data-game="ball" data-color="#84CC16" data-glow="rgba(132, 204, 22, 0.35)">Think You Know Ball?</button>
            <button class="tab-btn" data-game="cluegram" data-color="#cc007e" data-glow="rgba(204, 0, 126, 0.35)">Cluegram</button>
            <button class="tab-btn" data-game="questions" data-color="#D4AF37" data-glow="rgba(212, 175, 55, 0.35)">Questions</button>
            <button class="tab-btn" data-game="wordclimb" data-color="#3B82F6" data-glow="rgba(59, 130, 246, 0.35)">Word Climb</button>
            <button class="tab-btn" data-game="clusters" data-color="#ff751f" data-glow="rgba(255, 117, 31, 0.35)">Clusters</button>
            <button class="tab-btn" data-game="parity" data-color="#ff9999" data-glow="rgba(255, 153, 153, 0.35)">Parity</button>
        </div>

        <!-- Set Metadata Box -->
        <div class="set-meta-card">
            <div class="set-title-text" id="meta-set-title">Think You Know Ball? — Set 18</div>
            <div class="set-date-badge">YESTERDAY'S RECAP</div>
        </div>

        <!-- Answers Display Zone -->
        <div class="answers-list" id="answers-list">
            <!-- Dynamic Content Rendered Here -->
        </div>

        <!-- Commercial / Affiliate Slot -->
        <div class="promo-affiliate-card">
            <div class="affiliate-badge">OFFICIAL MATCHDAY PARTNER</div>
            <div class="affiliate-title">WANT UNLIMITED ARCHIVE ACCESS?</div>
            <div class="affiliate-desc">Play every past 10-floor climb, unlock custom daily quizzes, and remove single-attempt streak limits.</div>
            <button class="affiliate-btn">UNLOCK FULL ARCHIVE — £20/YEAR</button>
        </div>
    </div>

    <script>
        /* ==========================================================================
           GAME DATASETS FOR YESTERDAY'S ANSWERS RECAP
           ========================================================================== */
        const gameDataStore = {
            ball: {
                title: "Think You Know Ball? - Set 18",
                type: "ball",
                questions: [
                    { floor: 1, type: "multiple_choice", question: "Which manager guided West Ham United to a 7th-place Premier League finish and the FA Cup final in the 2005–06 season?", options: ["Alan Pardew", "Glenn Roeder", "Harry Redknapp", "Gianfranco Zola"], answer: "Alan Pardew", explanation: "Alan Pardew won promotion with West Ham in 2005 and immediately led them to a 7th-place finish and an unforgettable 3–3 FA Cup final against Liverpool.", anchorClues: "Alan Pardew / West Ham United 2005–06 season" },
                    { floor: 2, type: "boolean", question: "True or False: Sunderland's Stadium of Light hosted the senior England national team for a competitive UEFA European Championship qualifier in April 2003.", options: ["True", "False"], answer: "True", explanation: "England played Turkey at the Stadium of Light in a Euro 2004 qualifier on 2 April 2003, securing a 2–0 victory thanks to goals from Darius Vassell and David Beckham.", anchorClues: "Stadium of Light / England vs Turkey Euro 2004 qualifier" },
                    { floor: 3, type: "multiple_choice", question: "Which club became the first team to defeat Pep Guardiola's Manchester City in the Premier League during their 'Centurions' 2017–18 campaign?", options: ["Liverpool", "Manchester United", "Tottenham Hotspur", "Chelsea"], answer: "Liverpool", explanation: "Jürgen Klopp's Liverpool earned a thrilling 4–3 victory at Anfield in January 2018, handing Manchester City their first league defeat of the season.", anchorClues: "Liverpool beat Manchester City 4–3 January 2018" }
                ]
            },
            cluegram: {
                title: "11th Floor Cluegram — Daily Set 04",
                type: "cluegram",
                floors: [
                    { floor: 1, scrambled: "LANGE", target: "ANGEL", clue: "A spiritual celestial creature typically depicted in white robes with wings." },
                    { floor: 2, scrambled: "PELAM", target: "MAPLE", clue: "A hardwood tree famous for its distinctive lobed leaves and sweet syrup." },
                    { floor: 3, scrambled: "TLANEM", target: "MANTLE", clue: "An ornamental structure surrounding a fireplace, or a cloak of authority." }
                ]
            },
            questions: {
                title: "11th Floor Questions — High-Brow Trivia Set 12",
                type: "questions",
                questions: [
                    { floor: 1, type: "multiple_choice", question: "Which element on the periodic table has the chemical symbol 'Hg'?", options: ["Mercury", "Silver", "Hydragyrum", "Lead"], answer: "Mercury", explanation: "Hg comes from 'Hydrargyrum', the Latinized form of the Greek word meaning 'water-silver'.", anchorClues: "Element Hg / Mercury" }
                ]
            },
            wordclimb: {
                title: "11th Floor Word Climb — Daily Challenge #08",
                type: "wordclimb",
                floors: [
                    { floor: 1, targetLen: 5, centerLetter: "A", wheelLetters: ["L", "N", "G", "E"], targetWord: "ANGEL", validWords: ["ANGEL", "ANGLE", "GLAN", "LANE", "LEAN"] },
                    { floor: 2, targetLen: 6, centerLetter: "T", wheelLetters: ["L", "A", "N", "M", "E"], targetWord: "MANTLE", validWords: ["MANTLE", "LAMENT", "MENTAL", "LATE", "MEANT", "TAME"] }
                ]
            },
            clusters: {
                title: "11th Floor Clusters — Puzzle #01: Global Alignment",
                type: "clusters",
                floors: {
                    1: { type: "distractor-12", tiles: ["LONDON", "PARIS", "TOKYO", "NILE", "AMAZON", "YANGTZE", "PIANO", "GUITAR", "VIOLIN", "DRUM", "FLUTE", "TRUMPET"], groups: [{ words: ["LONDON", "PARIS", "TOKYO"], category: "Major global capital cities" }, { words: ["NILE", "AMAZON", "YANGTZE"], category: "Major world rivers" }] }
                }
            },
            parity: {
                title: "11th Floor Parity — Guess Who? Retro Avatars",
                type: "parity",
                floors: [
                    { floor: 1, pairs: 1, timeLimit: 12, icons: ["detective"] },
                    { floor: 2, pairs: 2, timeLimit: 16, icons: ["detective", "chef"] }
                ]
            }
        };

        const ordinals = ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th", "10th"];

        /* ==========================================================================
           RENDER ENGINE
           ========================================================================== */
        function renderGameAnswers(gameKey) {
            const data = gameDataStore[gameKey] || gameDataStore.ball;
            document.getElementById('meta-set-title').innerText = data.title;
            const container = document.getElementById('answers-list');
            container.innerHTML = '';

            if (data.type === 'ball' || data.type === 'questions') {
                data.questions.forEach(q => {
                    const floorOrd = ordinals[q.floor - 1] || `${q.floor}th`;
                    let optionsHTML = '';
                    q.options.forEach(opt => {
                        const isCorrect = (opt === q.answer);
                        optionsHTML += `<div class="opt-chip ${isCorrect ? 'correct-chip' : ''}">${opt}</div>`;
                    });

                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${q.type === 'boolean' ? 'TRUE / FALSE' : 'MULTIPLE CHOICE'}</div>
                            </div>
                            <div class="floor-card-body">
                                <div class="q-text">${q.question}</div>
                                <div class="options-list">${optionsHTML}</div>
                                <div class="fact-box">
                                    <div class="fact-title">Terrace Context & Deep Fact</div>
                                    <div class="fact-text">${q.explanation}</div>
                                    ${q.anchorClues ? `<div class="anchor-tag">📌 ${q.anchorClues}</div>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else if (data.type === 'cluegram') {
                data.floors.forEach(item => {
                    const floorOrd = ordinals[item.floor - 1] || `${item.floor}th`;
                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${item.target.length} LETTERS</div>
                            </div>
                            <div class="floor-card-body">
                                <div class="q-text">Scrambled: <strong style="color: #facc15; font-family: monospace; font-size: 0.9rem;">${item.scrambled}</strong></div>
                                <div class="opt-chip correct-chip" style="font-size: 0.85rem; letter-spacing: 2px;">TARGET: ${item.target}</div>
                                <div class="fact-box">
                                    <div class="fact-title">Clue Definition</div>
                                    <div class="fact-text">${item.clue}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else if (data.type === 'wordclimb') {
                data.floors.forEach(item => {
                    const floorOrd = ordinals[item.floor - 1] || `${item.floor}th`;
                    const outerLetters = item.wheelLetters.map(l => `<div class="letter-bubble">${l}</div>`).join('');
                    const validWordsList = item.validWords.map(w => `<span class="opt-chip ${w === item.targetWord ? 'correct-chip' : ''}" style="padding: 4px 6px;">${w}</span>`).join(' ');

                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${item.targetLen} LETTERS</div>
                            </div>
                            <div class="floor-card-body">
                                <div class="q-text">Active Wheel Letters (Center Key Highlighted):</div>
                                <div class="wheel-letters-row">
                                    <div class="letter-bubble center-key">${item.centerLetter}</div>
                                    ${outerLetters}
                                </div>
                                <div class="cluster-group-box">
                                    <div class="cluster-cat-title">✓ TARGET SOLUTION & ALL VALID WORDS</div>
                                    <div class="word-matrix-grid">${validWordsList}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else if (data.type === 'clusters') {
                Object.keys(data.floors).forEach(floorNum => {
                    const fData = data.floors[floorNum];
                    const floorOrd = ordinals[parseInt(floorNum, 10) - 1] || `${floorNum}th`;
                    
                    let groupsHTML = '';
                    let matchedWords = [];
                    fData.groups.forEach(g => {
                        matchedWords.push(...g.words);
                        const wordsList = g.words.map(w => `<span class="opt-chip correct-chip" style="padding: 4px 6px;">${w}</span>`).join(' ');
                        groupsHTML += `
                            <div class="cluster-group-box">
                                <div class="cluster-cat-title">✓ ${g.category}</div>
                                <div class="cluster-words-row">${wordsList}</div>
                            </div>
                        `;
                    });

                    const distractors = fData.tiles.filter(t => !matchedWords.includes(t));
                    const distractorsHTML = distractors.map(d => `<span class="opt-chip trap-chip" style="padding: 4px 6px;">${d}</span>`).join(' ');

                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${fData.type.toUpperCase()}</div>
                            </div>
                            <div class="floor-card-body">
                                ${groupsHTML}
                                ${distractors.length ? `
                                    <div class="cluster-group-box" style="border-color: rgba(239,68,68,0.3);">
                                        <div class="cluster-cat-title" style="color: #ef4444;">✖ TRAP DISTRACTORS</div>
                                        <div class="cluster-words-row">${distractorsHTML}</div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            } else if (data.type === 'parity') {
                data.floors.forEach(item => {
                    const floorOrd = ordinals[item.floor - 1] || `${item.floor}th`;
                    const iconsHTML = item.icons.map(ic => `<span class="opt-chip" style="text-transform: capitalize;">${ic}</span>`).join(' ');
                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${item.pairs} PAIRS • ${item.timeLimit}S LIMIT</div>
                            </div>
                            <div class="floor-card-body">
                                <div class="q-text">Active Avatar Vector Set:</div>
                                <div class="options-list">${iconsHTML}</div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        /* ==========================================================================
           TAB SWITCHER & ACCENT TINTING
           ========================================================================== */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const gameKey = btn.getAttribute('data-game');
                const accentColor = btn.getAttribute('data-color');
                const glowColor = btn.getAttribute('data-glow');

                document.documentElement.style.setProperty('--current-accent', accentColor);
                document.documentElement.style.setProperty('--current-glow', glowColor);

                renderGameAnswers(gameKey);
            });
        });

        // Initial Load
        window.onload = () => {
            renderGameAnswers('ball');
        };
    </script>
</body>
</html>
