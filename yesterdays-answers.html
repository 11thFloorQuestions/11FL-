<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Eleventh Floor Games — Yesterday's Answers</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;600;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-card: #111111;
            --surface-border: #1e1e1e;
            --surface-border-light: #2a2a2a;
            --accent-red: #ff1f2d;
            --text-primary: #ffffff;
            --text-muted: #888888;

            /* Game Accent Palette */
            --color-terrace: #84CC16;
            --color-terrace-glow: rgba(132, 204, 22, 0.25);
            --color-cluegram: #cc007e;
            --color-cluegram-glow: rgba(204, 0, 126, 0.25);
            --color-questions: #D4AF37;
            --color-questions-glow: rgba(212, 175, 55, 0.25);
            --color-wordclimb: #3B82F6;
            --color-wordclimb-glow: rgba(59, 130, 246, 0.25);
            --color-clusters: #ff751f;
            --color-clusters-glow: rgba(255, 117, 31, 0.25);
            --color-parity: #ff9999;
            --color-parity-glow: rgba(255, 153, 153, 0.25);

            --current-accent: var(--color-terrace);
            --current-glow: var(--color-terrace-glow);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 12px 32px 12px;
        }

        .top-bar {
            width: 100%;
            max-width: 480px;
            display: flex;
            justify-content: flex-start;
            margin-bottom: 8px;
        }

        .pill-btn {
            background: var(--surface);
            border: 1px solid var(--surface-border-light);
            color: var(--text-primary);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.65rem;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .pill-btn:hover {
            border-color: var(--current-accent);
            color: var(--current-accent);
        }

        .archive-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Sleek Header Branding */
        .hub-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 2px;
        }

        .hub-logo-red {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--accent-red);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 31, 45, 0.3);
            margin-bottom: 4px;
            animation: logoColorCycle 8s ease-in-out infinite;
        }

        .hub-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .hub-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        @keyframes logoColorCycle {
            0%   { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.3); }
            14%  { color: var(--color-terrace); text-shadow: 0 0 20px var(--color-terrace-glow); }
            28%  { color: var(--color-cluegram); text-shadow: 0 0 20px var(--color-cluegram-glow); }
            42%  { color: var(--color-questions); text-shadow: 0 0 20px var(--color-questions-glow); }
            56%  { color: var(--color-wordclimb); text-shadow: 0 0 20px var(--color-wordclimb-glow); }
            70%  { color: var(--color-clusters); text-shadow: 0 0 20px var(--color-clusters-glow); }
            84%  { color: var(--color-parity); text-shadow: 0 0 20px var(--color-parity-glow); }
            100% { color: var(--accent-red); text-shadow: 0 0 20px rgba(255, 31, 45, 0.3); }
        }

        /* Game Switcher Tabs */
        .game-tabs-scroll {
            width: 100%;
            overflow-x: auto;
            display: flex;
            gap: 6px;
            padding: 2px 0;
            scrollbar-width: none;
        }

        .game-tabs-scroll::-webkit-scrollbar { display: none; }

        .tab-btn {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            color: var(--text-muted);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.62rem;
            font-weight: 600;
            padding: 7px 11px;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .tab-btn.active {
            color: #ffffff;
            border-color: var(--current-accent);
            box-shadow: 0 0 10px var(--current-glow);
            background: #141414;
        }

        /* Set Metadata Box */
        .set-meta-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            padding: 10px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .set-title-text {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .set-date-badge {
            font-size: 0.55rem;
            font-weight: 600;
            background: #181818;
            border: 1px solid #282828;
            padding: 3px 6px;
            border-radius: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* Dynamic Floor Stack */
        .answers-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .floor-card {
            background: var(--surface-card);
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .floor-card-header {
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #121212;
            border-bottom: 1px solid #1a1a1a;
        }

        .floor-number-badge {
            font-family: 'Anton', sans-serif;
            font-size: 1rem;
            color: var(--current-accent);
            letter-spacing: 0.5px;
        }

        .floor-type-tag {
            font-size: 0.52rem;
            font-weight: 700;
            color: var(--text-muted);
            background: #000000;
            border: 1px solid #222222;
            padding: 2px 5px;
            border-radius: 3px;
            text-transform: uppercase;
        }

        .floor-card-body {
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .q-text {
            font-size: 0.74rem;
            font-weight: 500;
            line-height: 1.35;
            color: #eeeeee;
        }

        .options-list {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 5px;
        }

        .opt-chip {
            font-size: 0.62rem;
            font-weight: 600;
            padding: 6px;
            border-radius: 4px;
            background: #080808;
            border: 1px solid #1a1a1a;
            color: var(--text-muted);
            text-align: center;
        }

        .opt-chip.correct-chip {
            background: rgba(34, 197, 94, 0.1);
            border-color: #22c55e;
            color: #86EFAC;
        }

        .opt-chip.trap-chip {
            background: rgba(239, 68, 68, 0.1);
            border-color: #ef4444;
            color: #FCA5A5;
        }

        /* Blossom-Style Word Climb Layout */
        .wheel-letters-row {
            display: flex;
            gap: 5px;
            align-items: center;
            justify-content: center;
            margin: 2px 0;
        }

        .letter-bubble {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #141414;
            border: 1px solid var(--surface-border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            color: #ffffff;
        }

        .blossom-stats-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
            margin: 4px 0;
            background: #080808;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 8px;
            text-align: center;
        }

        .blossom-stat-val {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-wordclimb);
        }

        .blossom-stat-lbl {
            font-size: 0.48rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .word-accordion-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
        }

        .cluster-group-box {
            background: #080808;
            border: 1px solid #1a1a1a;
            border-radius: 4px;
            padding: 7px 9px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .cluster-cat-title {
            font-size: 0.58rem;
            font-weight: 700;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .cluster-words-row {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
        }

        /* Context / Fact Callout */
        .fact-box {
            background: #080808;
            border-left: 2px solid var(--current-accent);
            padding: 8px 10px;
            border-radius: 0 4px 4px 0;
        }

        .fact-title {
            font-size: 0.52rem;
            font-weight: 700;
            color: var(--current-accent);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 3px;
        }

        .fact-text {
            font-size: 0.65rem;
            font-weight: 400;
            color: #bbbbbb;
            line-height: 1.3;
        }

        .anchor-tag {
            display: inline-block;
            margin-top: 4px;
            font-size: 0.52rem;
            font-weight: 600;
            color: var(--text-muted);
            background: #121212;
            padding: 2px 5px;
            border-radius: 3px;
        }

        /* Commercial Upgrade Banner */
        .promo-affiliate-card {
            background: linear-gradient(135deg, #121212 0%, #080808 100%);
            border: 1px solid var(--current-accent);
            border-radius: 6px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            text-align: center;
            box-shadow: 0 0 12px var(--current-glow);
            margin-top: 6px;
        }

        .affiliate-badge {
            font-size: 0.48rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            color: var(--current-accent);
            text-transform: uppercase;
        }

        .affiliate-title {
            font-family: 'Anton', sans-serif;
            font-size: 1rem;
            color: #ffffff;
            text-transform: uppercase;
        }

        .affiliate-desc {
            font-size: 0.62rem;
            color: var(--text-muted);
            line-height: 1.3;
            font-weight: 400;
        }

        .affiliate-btn {
            background: var(--current-accent);
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            padding: 8px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 2px;
        }
    </style>
</head>

                type: "clusters",

                    1: { type: "distractor-12", tiles: ["LONDON", "PARIS", "TOKYO", "NILE", "AMAZON", "YANGTZE", "PIANO", "GUITAR", "VIOLIN", "DRUM", "FLUTE", "TRUMPET"], groups: [{ words: ["LONDON", "PARIS", "TOKYO"], category: "Major global capital cities" }, { words: ["NILE", "AMAZON", "YANGTZE"], category: "Major world rivers" }] },
                    2: { type: "distractor-12", tiles: ["GOLD", "SILVER", "BRONZE", "DIAMOND", "RUBY", "EMERALD", "SQUARE", "CIRCLE", "TRIANGLE", "RECTANGLE", "OVAL", "PENTAGON"], groups: [{ words: ["GOLD", "SILVER", "BRONZE"], category: "Precious metals / podium medals" }, { words: ["DIAMOND", "RUBY", "EMERALD"], category: "Precious gemstones" }] },
                    3: { type: "distractor-12", tiles: ["MARS", "VENUS", "JUPITER", "LION", "TIGER", "LEOPARD", "EAGLE", "HAWK", "FALCON", "OWL", "CROW", "SWAN"], groups: [{ words: ["MARS", "VENUS", "JUPITER"], category: "Planets of the solar system" }, { words: ["LION", "TIGER", "LEOPARD"], category: "Large wild cats" }] },
                    4: { type: "distractor-12", tiles: ["RED", "BLUE", "GREEN", "OAK", "PINE", "MAPLE", "APPLE", "BANANA", "ORANGE", "GRAPE", "MANGO", "PEACH"], groups: [{ words: ["RED", "BLUE", "GREEN"], category: "Primary colors" }, { words: ["OAK", "PINE", "MAPLE"], category: "Common tree species" }] },
                    5: { type: "distractor-12-three", tiles: ["FOOTBALL", "TENNIS", "CRICKET", "CHESS", "POKER", "BRIDGE", "VIOLIN", "CELLO", "FLUTE", "PYTHON", "VIPER", "COBRA"], groups: [{ words: ["FOOTBALL", "TENNIS", "CRICKET"], category: "Popular global ball sports" }, { words: ["CHESS", "POKER", "BRIDGE"], category: "Strategic tabletop games" }, { words: ["VIOLIN", "CELLO", "FLUTE"], category: "Orchestral instruments" }] },
                    6: { type: "distractor-12-three", tiles: ["IRON", "COPPER", "TIN", "WHEAT", "RICE", "MAIZE", "MILK", "WATER", "JUICE", "SOFA", "TABLE", "CHAIR"], groups: [{ words: ["IRON", "COPPER", "TIN"], category: "Industrial base metals" }, { words: ["WHEAT", "RICE", "MAIZE"], category: "Staple grains" }, { words: ["MILK", "WATER", "JUICE"], category: "Common beverages" }] },
                    7: { type: "distractor-12-three", tiles: ["PLATO", "ARISTOTLE", "SOCRATES", "BACH", "MOZART", "BEETHOVEN", "NEWTON", "EINSTEIN", "DARWIN", "SHAKESPEARE", "DANTE", "HOMER"], groups: [{ words: ["PLATO", "ARISTOTLE", "SOCRATES"], category: "Ancient Greek philosophers" }, { words: ["BACH", "MOZART", "BEETHOVEN"], category: "Classical composers" }, { words: ["NEWTON", "EINSTEIN", "DARWIN"], category: "Revolutionary scientists" }] },
                    8: { type: "distractor-12-three", tiles: ["PACIFIC", "ATLANTIC", "INDIAN", "EVEREST", "K2", "KILIMANJARO", "SAHARA", "GOBI", "KALAHARI", "LYON", "MARSEILLE", "NICE"], groups: [{ words: ["PACIFIC", "ATLANTIC", "INDIAN"], category: "Major world oceans" }, { words: ["EVEREST", "K2", "KILIMANJARO"], category: "Mountain peaks" }, { words: ["SAHARA", "GOBI", "KALAHARI"], category: "Deserts" }] },
                    9: { type: "distractor-12-three", tiles: ["TUDOR", "STUART", "WINDSOR", "SPRING", "SUMMER", "AUTUMN", "NORTH", "SOUTH", "EAST", "RAIN", "SNOW", "WIND"], groups: [{ words: ["TUDOR", "STUART", "WINDSOR"], category: "Historic royal houses" }, { words: ["SPRING", "SUMMER", "AUTUMN"], category: "Seasons" }, { words: ["NORTH", "SOUTH", "EAST"], category: "Cardinal directions" }] },
                    10: { type: "wall-16", tiles: ["THAMES", "SEVERN", "TRENT", "CLYDE", "GOLD", "SILVER", "BRONZE", "PLATINUM", "MARBLE", "GRANITE", "SLATE", "CHALK", "OXFORD", "BOND", "FLEET", "LOMBARD"], groups: [{ words: ["THAMES", "SEVERN", "TRENT", "CLYDE"], category: "Regional river systems" }, { words: ["GOLD", "SILVER", "BRONZE", "PLATINUM"], category: "Precious metals" }, { words: ["MARBLE", "GRANITE", "SLATE", "CHALK"], category: "Geological stone" }, { words: ["OXFORD", "BOND", "FLEET", "LOMBARD"], category: "Historic thoroughfares" }] }
                }
            },
            parity: {
                title: "11th Floor Parity — Guess Who? Retro Avatars",
                type: "parity",
                floors: [
                    { floor: 1, pairs: 1, timeLimit: 12, icons: ["detective"] },
                    { floor: 2, pairs: 2, timeLimit: 16, icons: ["detective", "chef"] },
                    { floor: 3, pairs: 3, timeLimit: 22, icons: ["detective", "chef", "pirate"] },
                    { floor: 4, pairs: 4, timeLimit: 28, icons: ["detective", "chef", "pirate", "spectacles"] },
                    { floor: 5, pairs: 5, timeLimit: 34, icons: ["detective", "chef", "pirate", "spectacles", "beanie"] },
                    { floor: 6, pairs: 6, timeLimit: 40, icons: ["detective", "chef", "pirate", "spectacles", "beanie", "monocle"] },
                    { floor: 7, pairs: 7, timeLimit: 46, icons: ["detective", "chef", "pirate", "spectacles", "beanie", "monocle", "dj"] },
                    { floor: 8, pairs: 8, timeLimit: 52, icons: ["detective", "chef", "pirate", "spectacles", "beanie", "monocle", "dj", "astronaut"] },
                    { floor: 9, pairs: 9, timeLimit: 58, icons: ["detective", "chef", "pirate", "spectacles", "beanie", "monocle", "dj", "astronaut", "beret"] },
                    { floor: 10, pairs: 10, timeLimit: 64, icons: ["detective", "chef", "pirate", "spectacles", "beanie", "monocle", "dj", "astronaut", "beret", "disguise"] }
                ]
            }
        };

        const ordinals = ["1st", "2nd", "3rd", "4th", "5th", "6th", "7th", "8th", "9th", "10th"];

        /* ==========================================================================
           RENDER ENGINE
           ========================================================================== */
        function renderGameAnswers(gameKey) {
            const data = gameDataStore[gameKey] || gameDataStore.ball;
            document.getElementById('meta-set-title').innerText = data.title;
            const container = document.getElementById('answers-list');
            container.innerHTML = '';

            if (data.type === 'ball' || data.type === 'questions') {
                data.questions.forEach(q => {
                    const floorOrd = ordinals[q.floor - 1] || `${q.floor}th`;
                    let optionsHTML = '';
                    q.options.forEach(opt => {
                        const isCorrect = (opt === q.answer);
                        optionsHTML += `<div class="opt-chip ${isCorrect ? 'correct-chip' : ''}">${opt}</div>`;
                    });

                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${q.type === 'boolean' ? 'TRUE / FALSE' : 'MULTIPLE CHOICE'}</div>
                            </div>
                            <div class="floor-card-body">
                                <div class="q-text">${q.question}</div>
                                <div class="options-list">${optionsHTML}</div>
                                <div class="fact-box">
                                    <div class="fact-title">Terrace Context & Fact</div>
                                    <div class="fact-text">${q.explanation}</div>
                                    ${q.anchorClues ? `<div class="anchor-tag">📌 ${q.anchorClues}</div>` : ''}
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else if (data.type === 'cluegram') {
                data.floors.forEach(item => {
                    const floorOrd = ordinals[item.floor - 1] || `${item.floor}th`;
                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${item.target.length} LETTERS</div>
                            </div>
                            <div class="floor-card-body">
                                <div class="q-text">Scrambled: <strong style="color: #3B82F6; font-family: monospace;">${item.scrambled}</strong></div>
                                <div class="opt-chip correct-chip" style="font-size: 0.7rem; letter-spacing: 1px;">TARGET: ${item.target}</div>
                                <div class="fact-box">
                                    <div class="fact-title">Clue Definition</div>
                                    <div class="fact-text">${item.clue}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });
            } else if (data.type === 'wordclimb') {
                const wheelBubbles = data.wheelLetters.map(l => `<div class="letter-bubble">${l}</div>`).join('');
                
                // Wheel Header + Blossom-Style Totals Grid
                container.innerHTML += `
                    <div class="cluster-group-box" style="border-color: var(--color-wordclimb); margin-bottom: 2px;">
                        <div class="cluster-cat-title" style="color: var(--color-wordclimb); text-align: center;">DAILY MASTER WHEEL</div>
                        <div class="wheel-letters-row">${wheelBubbles}</div>
                        <div style="font-size: 0.58rem; color: var(--text-muted); text-align: center; margin-top: 2px;">Master 9-Letter Target: <strong style="color: #ffffff;">${data.masterWord}</strong></div>
                    </div>

                    <div class="blossom-stats-grid">
                        <div><div class="blossom-stat-val">${data.counts.len5}</div><div class="blossom-stat-lbl">5-Letter</div></div>
                        <div><div class="blossom-stat-val">${data.counts.len6}</div><div class="blossom-stat-lbl">6-Letter</div></div>
                        <div><div class="blossom-stat-val">${data.counts.len7}</div><div class="blossom-stat-lbl">7-Letter</div></div>
                        <div><div class="blossom-stat-val">${data.counts.len8}</div><div class="blossom-stat-lbl">8-Letter</div></div>
                        <div><div class="blossom-stat-val">${data.counts.len9}</div><div class="blossom-stat-lbl">9-Letter</div></div>
                    </div>
                `;

                // Scrollable Accordion for All Available Words Grouped by Length (5 to 9)
                let accordionSections = '';
                [5, 6, 7, 8, 9].forEach(len => {
                    const words = data.wordsByLength[len] || [];
                    if (words.length > 0) {
                        const wordChips = words.map(w => `<span class="opt-chip ${w === data.masterWord ? 'correct-chip' : ''}" style="padding: 3px 6px; font-size: 0.58rem;">${w}</span>`).join(' ');
                        accordionSections += `
                            <div class="cluster-group-box">
                                <div class="cluster-cat-title">✓ ${len}-LETTER VALID WORDS (${words.length})</div>
                                <div class="cluster-words-row">${wordChips}</div>
                            </div>
                        `;
                    }
                });

                container.innerHTML += `
                    <div class="word-accordion-container">
                        ${accordionSections}
                    </div>
                `;
            } else if (data.type === 'clusters') {
                Object.keys(data.floors).forEach(floorNum => {
                    const fData = data.floors[floorNum];
                    const floorOrd = ordinals[parseInt(floorNum, 10) - 1] || `${floorNum}th`;
                    
                    let groupsHTML = '';
                    let matchedWords = [];
                    fData.groups.forEach(g => {
                        matchedWords.push(...g.words);
                        const wordsList = g.words.map(w => `<span class="opt-chip correct-chip" style="padding: 3px 5px; font-size: 0.58rem;">${w}</span>`).join(' ');
                        groupsHTML += `
                            <div class="cluster-group-box">
                                <div class="cluster-cat-title">✓ ${g.category}</div>
                                <div class="cluster-words-row">${wordsList}</div>
                            </div>
                        `;
                    });

                    const distractors = fData.tiles.filter(t => !matchedWords.includes(t));
                    const distractorsHTML = distractors.map(d => `<span class="opt-chip trap-chip" style="padding: 3px 5px; font-size: 0.58rem;">${d}</span>`).join(' ');

                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${fData.type.toUpperCase()}</div>
                            </div>
                            <div class="floor-card-body">
                                ${groupsHTML}
                                ${distractors.length ? `
                                    <div class="cluster-group-box" style="border-color: rgba(239,68,68,0.2);">
                                        <div class="cluster-cat-title" style="color: #ef4444;">✖ TRAP DISTRACTORS</div>
                                        <div class="cluster-words-row">${distractorsHTML}</div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    `;
                });
            } else if (data.type === 'parity') {
                data.floors.forEach(item => {
                    const floorOrd = ordinals[item.floor - 1] || `${item.floor}th`;
                    const iconsHTML = item.icons.map(ic => `<span class="opt-chip" style="text-transform: capitalize; padding: 4px 6px;">${ic}</span>`).join(' ');
                    container.innerHTML += `
                        <div class="floor-card">
                            <div class="floor-card-header">
                                <div class="floor-number-badge">${floorOrd} Floor</div>
                                <div class="floor-type-tag">${item.pairs} PAIRS • ${item.timeLimit}S LIMIT</div>
                            </div>
                            <div class="floor-card-body">
                                <div class="q-text">Active Avatar Vector Set:</div>
                                <div class="options-list">${iconsHTML}</div>
                            </div>
                        </div>
                    `;
                });
            }
        }

        /* ==========================================================================
           TAB SWITCHER & ACCENT TINTING
           ========================================================================== */
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                const gameKey = btn.getAttribute('data-game');
                const accentColor = btn.getAttribute('data-color');
                const glowColor = btn.getAttribute('data-glow');

                document.documentElement.style.setProperty('--current-accent', accentColor);
                document.documentElement.style.setProperty('--current-glow', glowColor);

                renderGameAnswers(gameKey);
            });
        });

        // Initial Load
        window.onload = () => {
            renderGameAnswers('ball');
        };
    </script>
</body>
</html>
