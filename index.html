<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11th Floor Questions</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- LANDING SCREEN -->
  <div id="landing-screen" class="app-screen">
    <div class="landing-hero">
      <h1 class="logo-title">11FL?</h1>
      <p class="subtitle">ELEVATOR TRIVIA CLIMB</p>
    </div>
    
    <div class="game-select-container">
      <button id="goto-questions-btn" class="game-card-btn">
        <div class="card-tag">GAME 01</div>
        <h3>11TH FLOOR QUESTIONS</h3>
        <p>Answer trivia under pressure to climb 11 floors to the Penthouse.</p>
      </button>

      <button id="goto-wordclimb-btn" class="game-card-btn" onclick="showScreen('wordclimb-screen')">
        <div class="card-tag">GAME 02</div>
        <h3>WORD CLIMB</h3>
        <p>Decipher 5-letter codes to reach the top level.</p>
      </button>
    </div>
  </div>

  <!-- QUESTIONS GAME SCREEN -->
  <div id="questions-screen" class="app-screen hidden">
    <header class="game-header">
      <button class="nav-btn" onclick="resetToLobby()">✕ LOBBY</button>
      <div class="hud-display">
        <span id="hud-floor-label">FLOOR 01</span>
      </div>
      <button id="sound-toggle" class="nav-btn">🔊 SOUND: ON</button>
    </header>

    <main class="game-layout">
      <!-- Elevator Shaft Column -->
      <aside id="floor-counter" class="shaft-column"></aside>

      <!-- Main Play View -->
      <section id="game-view" class="game-card-view"></section>
    </main>
  </div>

  <!-- WORD CLIMB SCREEN -->
  <div id="wordclimb-screen" class="app-screen hidden">
    <header class="game-header">
      <button class="nav-btn" onclick="resetToLobby()">✕ LOBBY</button>
      <div class="hud-display">
        <span>WORD CLIMB</span>
      </div>
    </header>
    <div id="wordclimb-view" class="game-card-view"></div>
  </div>

  <script src="script.js"></script>
  <script src="word-climb.js"></script>
</body>
</html>
