<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Games</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            background-color: #0b0b0b;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
        }

        .app-screen {
            width: 100%;
            height: 100vh;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            background-color: #0b0b0b;
        }

        .hidden {
            display: none !important;
        }

        /* Landing Hub Styles */
        .landing-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            width: 100%;
            max-width: 480px;
            padding: 24px;
        }

        .logo-title {
            font-size: 4.5rem;
            font-weight: 900;
            color: #ff1f2d;
            letter-spacing: 2px;
            line-height: 1;
            text-transform: uppercase;
        }

        .logo-subtitle {
            font-size: 1.1rem;
            font-weight: 400;
            color: #ffffff;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .logo-sub-bottom {
            font-size: 0.8rem;
            font-weight: 700;
            color: #cccccc;
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-top: 4px;
            margin-bottom: 30px;
        }

        .game-select-container {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
        }

        .game-card-btn {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 10px;
            padding: 18px 20px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            cursor: pointer;
            text-align: left;
            transition: border-color 0.2s;
        }

        .game-card-btn:hover, .game-card-btn:active {
            border-color: #ff1f2d;
            background: rgba(255, 31, 45, 0.05);
        }

        .game-num {
            font-size: 0.75rem;
            font-weight: 700;
            color: #ff1f2d;
            letter-spacing: 2px;
            margin-bottom: 4px;
        }

        .game-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #ffffff;
        }

        /* Generic Game Screen Styles */
        .game-container {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 480px;
            height: 100vh;
            height: 100dvh;
            margin: 0 auto;
            padding: 16px;
        }

        .top-utility-bar {
            display: flex;
            justify-content: space-between;
            width: 100%;
            margin-bottom: 10px;
        }

        .util-btn {
            background: #141414;
            border: 1px solid #333333;
            color: #cccccc;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
        }

        .game-card {
            background: #141414;
            border: 1px solid #262626;
            border-radius: 12px;
            width: 100%;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 10px 0;
            padding: 20px;
            position: relative;
            text-align: center;
        }

        .game-card h2 {
            font-size: 1.5rem;
            color: #ff1f2d;
            margin-bottom: 15px;
        }

        .game-card p {
            font-size: 1rem;
            color: #cccccc;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <!-- LANDING HUB SCREEN -->
    <div id="landing-screen" class="app-screen">
        <div class="landing-content">
            <h1 class="logo-title">11FL?</h1>
            <div class="logo-subtitle">Eleventh Floor</div>
            <div class="logo-sub-bottom">Games</div>
            
            <div class="game-select-container">
                <button class="game-card-btn" onclick="switchScreen('questions-screen')">
                    <span class="game-num">GAME 01</span>
                    <span class="game-name">11th Floor Questions</span>
                </button>
                <button class="game-card-btn" onclick="switchScreen('wordclimb-screen')">
                    <span class="game-num">GAME 02</span>
                    <span class="game-name">11th Floor Word Climb</span>
                </button>
            </div>
        </div>
    </div>

    <!-- 11TH FLOOR QUESTIONS SCREEN -->
    <div id="questions-screen" class="app-screen hidden">
        <div class="game-container">
            <div class="top-utility-bar">
                <button class="util-btn" onclick="switchScreen('landing-screen')">Exit</button>
                <button class="util-btn" onclick="alert('Next Question feature active!')">Next</button>
            </div>
            <div class="game-card">
                <h2>11th Floor Questions</h2>
                <p>Welcome to Game 01! Fully operational and ready to play.</p>
            </div>
        </div>
    </div>

    <!-- WORD CLIMB SCREEN -->
    <div id="wordclimb-screen" class="app-screen hidden">
        <div class="game-container">
            <div class="top-utility-bar">
                <button class="util-btn" onclick="switchScreen('landing-screen')">Exit</button>
                <button class="util-btn" onclick="alert('Archive feature active!')">Archive</button>
            </div>
            <div class="game-card">
                <h2>Word Climb</h2>
                <p>Welcome to Game 02! Wheel and gameplay mechanics active.</p>
            </div>
        </div>
    </div>

    <script>
        function switchScreen(screenId) {
            document.querySelectorAll('.app-screen').forEach(screen => {
                screen.classList.add('hidden');
            });
            document.getElementById(screenId).classList.remove('hidden');
        }
    </script>
</body>
</html>
