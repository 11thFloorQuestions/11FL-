<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11FL?</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- LANDING SCREEN (GAME HUB) -->
  <div id="landing-screen" class="app-screen screen active">
    <div class="landing-content">
      <div class="landing-logo-title">11FL?</div>
      <div class="landing-logo-subtitle">ELEVATOR TRIVIA CLIMB</div>
      <div class="landing-logo-sub-bottom">SELECT GAME</div>
      
      <div id="building-landing" class="building-shaft"></div>

      <div class="game-select-container">
        <!-- GAME 01: WORD CLIMB -->
        <div class="game-card-btn active-game" id="goto-wordclimb-btn">
          <div class="game-num">GAME 01</div>
          <div class="game-name">WORD CLIMB</div>
        </div>

        <!-- GAME 02: 11TH FLOOR QUESTIONS -->
        <div class="game-card-btn" id="goto-questions-btn">
          <div class="game-num">GAME 02</div>
          <div class="game-name">11TH FLOOR QUESTIONS</div>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME 01 SCREEN: WORD CLIMB -->
  <div id="game-screen" class="app-screen screen" style="display: none;">
    <div class="game-container">
      
      <div class="top-utility-bar">
        <button class="util-btn" id="exit-btn">✕ LOBBY</button>
        <button class="util-btn btn-audio-toggle" onclick="toggleAudio()">SOUND: OFF</button>
      </div>

      <div class="header-section">
        <div class="logo-title">11FL?</div>
        <div class="logo-subtitle">ELEVATOR TRIVIA CLIMB</div>
        <div class="logo-sub-bottom">WORD CLIMB</div>
      </div>

      <div class="game-card">
        <div id="card-floor-text">FLOOR 01</div>
        
        <div class="target-slots-container" id="target-word-slots"></div>

        <div id="message-box"></div>

        <div id="guess-display"></div>

        <div id="wheel-wrapper">
          <div id="wheel-container"></div>
        </div>
      </div>

      <div class="action-buttons-container">
        <button class="action-btn" id="action-delete-btn">DELETE</button>
        <button class="action-btn" id="action-submit-btn">SUBMIT</button>
      </div>

    </div>
  </div>

  <!-- GAME 02 SCREEN: 11TH FLOOR QUESTIONS -->
  <div id="questions-screen" class="app-screen screen" style="display: none;">
    <div class="game-container">
      
      <div class="top-utility-bar">
        <button class="util-btn" id="exit-questions-btn" onclick="resetToLobby()">✕ LOBBY</button>
        <button class="util-btn btn-audio-toggle" onclick="toggleAudio()">SOUND: OFF</button>
      </div>

      <div class="header-section">
        <div class="logo-title">11FL?</div>
        <div class="logo-subtitle">ELEVATOR TRIVIA CLIMB</div>
        <div class="logo-sub-bottom" id="hud-floor-label">FLOOR 01</div>
      </div>

      <div class="timer-bar-wrap">
        <div id="timer-bar"></div>
      </div>

      <div id="floor-counter" class="building-shaft"></div>

      <div class="game-card">
        <div id="game-view" class="game-view-content"></div>
      </div>

    </div>
  </div>

  <!-- STATS & ARCHIVE MODAL -->
  <div id="stats-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title">PLAYER STATS & VAULT</span>
        <button class="modal-close-btn" onclick="closeStatsModal()">✕</button>
      </div>
      <div id="stats-body"></div>
    </div>
  </div>

  <!-- SCRIPTS -->
  <script src="./script.js"></script>
  <script src="./word-climb.js"></script>
</body>
</html>
