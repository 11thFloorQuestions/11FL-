<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>11th Floor Games Hub</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
    }
    body {
      background-color: #080808;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .hub-container {
      width: 100%;
      max-width: 400px;
      text-align: center;
    }
    .hub-header {
      margin-bottom: 32px;
    }
    .brand-title {
      color: #ff1f2d;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 1px;
      line-height: 1;
    }
    .brand-subtitle {
      color: #888888;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-top: 8px;
    }
    .game-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .game-card {
      background-color: #121212;
      border: 1px solid #222222;
      border-radius: 16px;
      padding: 24px;
      text-decoration: none;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
    }
    .game-card:active {
      transform: scale(0.98);
      border-color: #ff1f2d;
    }
    .game-title {
      color: #ff1f2d;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .game-desc {
      color: #aaaaaa;
      font-size: 13px;
      line-height: 1.4;
      margin-bottom: 16px;
    }
    .play-badge {
      align-self: flex-end;
      background-color: #1a1a1a;
      border: 1px solid #ff1f2d;
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      padding: 6px 16px;
      border-radius: 12px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>

  <div class="hub-container">
    <div class="hub-header">
      <div class="brand-title">11FL GAMES</div>
      <div class="brand-subtitle">SELECT YOUR CHALLENGE</div>
    </div>

    <div class="game-grid">
      <!-- Game 1: 11th Floor Questions (TOP) -->
      <a href="questions.html" class="game-card">
        <div class="game-title">11TH FLOOR QUESTIONS</div>
        <div class="game-desc">Test your knowledge with daily elevator trivia and questions.</div>
        <div class="play-badge">PLAY NOW ↵</div>
      </a>

      <!-- Game 2: Word Climb (BOTTOM) -->
      <a href="word-climb.html" class="game-card">
        <div class="game-title">WORD CLIMB</div>
        <div class="game-desc">Ascend from Floor 04 to Floor 10 by spelling valid words from the letter wheel.</div>
        <div class="play-badge">PLAY NOW ↵</div>
      </a>
    </div>
  </div>

</body>
</html>
