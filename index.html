<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11FL?</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app-container">
    
    <!-- LANDING SCREEN -->
    <div id="landing-screen" class="screen" style="display: flex;">
      <div class="landing-header">
        <div class="game-title">11FL?</div>
        <div class="game-subtitle">ELEVATOR TRIVIA CLIMB</div>
      </div>
      
      <div class="landing-bldg-preview" id="building-landing"></div>
      
      <div class="landing-actions">
        <button class="btn-primary" id="goto-wordclimb-btn">START CLIMB</button>
        <div style="display: flex; gap: 8px; width: 100%;">
          <button class="btn-secondary" id="goto-questions-btn">STATS & VAULT</button>
          <button class="btn-secondary btn-audio-toggle">SOUND: OFF</button>
        </div>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="screen" style="display: none;">
      <div class="game-header">
        <div class="hud-floor" id="card-floor-text">FLOOR 01</div>
        <button class="btn-hud-icon" id="exit-btn">✕</button>
      </div>

      <div id="message-box"></div>

      <div class="target-word-slots" id="target-word-slots"></div>

      <div id="guess-display"></div>

      <div class="wheel-container" id="wheel-container"></div>

      <div style="display: flex; gap: 10px; width: 100%; max-width: 280px; margin: 0 auto;">
        <button id="action-delete-btn" class="btn-secondary" style="flex:1;">DELETE</button>
        <button id="action-submit-btn" class="btn-primary" style="flex:1;">SUBMIT</button>
      </div>
    </div>

  </div>

  <script src="./word-climb.js"></script>
</body>
</html>
