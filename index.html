<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eleventh Floor Games</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;600;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Main Hub Landing Page (Eleventh Floor Games) -->
    <div id="main-hub-screen" class="hub-container">
        <div class="hub-logo-box">
            <h1 class="hub-logo-red">11FL?</h1>
            <p class="hub-logo-title">Eleventh Floor</p>
            <p class="hub-logo-sub">GAMES</p>
        </div>

        <div class="hub-menu-box">
            <button id="btn-select-questions" class="btn-hub-option">11th Floor Questions</button>
            <button id="btn-select-word-climb" class="btn-hub-option">11th Floor Word Climb</button>
        </div>
    </div>

    <!-- Original 11th Floor Questions Game Layout -->
    <div id="landing-screen" class="screen-container" style="display: none;">
        <header class="header-nav">
            <div class="header-brand">
                <span class="brand-text">11TH FLOOR QUESTIONS</span>
            </div>
            <div class="header-controls">
                <button id="btn-sound-toggle" class="btn-nav">SOUND: OFF</button>
                <button id="btn-landing-stats" class="btn-nav">VAULT</button>
            </div>
        </header>

        <main class="landing-content">
            <div class="logo-container">
                <h1 class="logo-red">11FL?</h1>
                <p class="logo-subtitle">Eleventh Floor</p>
                <p class="logo-tagline">QUESTIONS</p>
            </div>

            <div class="landing-actions">
                <button id="btn-start-climb" class="btn-primary">START CLIMB</button>
                <button id="btn-hub-back" class="btn-secondary">BACK TO GAMES</button>
            </div>
        </main>
    </div>

    <!-- Active Game Screen -->
    <div id="game-screen" class="screen-container" style="display: none;">
        <header class="header-nav">
            <button id="btn-util-exit" class="btn-nav-icon">← EXIT</button>
            <div id="card-floor-text" class="floor-indicator">FLOOR 01</div>
            <button id="btn-sound-toggle-game" class="btn-nav">SOUND: OFF</button>
        </header>

        <main class="game-layout">
            <div id="building-shaft" class="building-shaft">
                <div class="floor-block" data-floor="10">10</div>
                <div class="floor-block" data-floor="9">09</div>
                <div class="floor-block" data-floor="8">08</div>
                <div class="floor-block" data-floor="7">07</div>
                <div class="floor-block" data-floor="6">06</div>
                <div class="floor-block" data-floor="5">05</div>
                <div class="floor-block" data-floor="4">04</div>
                <div class="floor-block" data-floor="3">03</div>
                <div class="floor-block" data-floor="2">02</div>
                <div class="floor-block" data-floor="1">01</div>
            </div>

            <section class="question-container">
                <div class="timer-wrapper">
                    <div id="timer-bar" class="timer-bar"></div>
                </div>

                <div id="question-text" class="question-text">Loading Question...</div>

                <div class="options-grid">
                    <button class="btn-option"></button>
                    <button class="btn-option"></button>
                    <button class="btn-option"></button>
                    <button class="btn-option"></button>
                </div>
            </section>
        </main>
    </div>

    <!-- Modals -->
    <div id="modal-game-over" class="modal-overlay hidden">
        <div class="modal-card">
            <h2 id="game-over-title">ELEVATOR STOPPED</h2>
            <p id="game-over-message">Incorrect Answer!</p>
            <p id="final-floor-reached">Stopped at FLOOR 01</p>
            <div class="modal-actions">
                <button id="btn-try-again" class="btn-modal">TRY AGAIN</button>
                <button id="btn-back-vault" class="btn-modal">VAULT</button>
            </div>
        </div>
    </div>

    <div id="modal-vault" class="modal-overlay hidden">
        <div class="modal-card modal-large">
            <h2>ARCHIVE VAULT</h2>
            <div id="vault-list" class="vault-grid"></div>
            <button id="btn-close-vault" class="btn-modal">CLOSE</button>
        </div>
    </div>

    <div id="modal-stats" class="modal-overlay hidden">
        <div class="modal-card">
            <h2>PLAYER STATS</h2>
            <div class="stats-grid">
                <div><span>PLAYED:</span> <strong id="stat-played">0</strong></div>
                <div><span>WINS:</span> <strong id="stat-wins">0</strong></div>
                <div><span>STREAK:</span> <strong id="stat-streak">0</strong></div>
                <div><span>BEST FLOOR:</span> <strong id="stat-best">FLOOR 01</strong></div>
            </div>
            <button id="btn-close-stats" class="btn-modal">CLOSE</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
