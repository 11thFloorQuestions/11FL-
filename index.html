<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Word Climb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- LANDING SCREEN VIEW -->
    <div id="landing-screen" class="app-screen">
        <div class="landing-card">
            <div class="header-section">
                <h1 class="logo-title">11FL?</h1>
                <p class="logo-subtitle">Eleventh Floor</p>
                <p class="logo-sub-bottom">Word Climb</p>
            </div>
            <button id="play-btn" class="landing-play-btn">PLAY</button>
        </div>
    </div>

    <!-- GAMEPLAY SCREEN VIEW (Hidden until Play is clicked) -->
    <div id="game-screen" class="app-screen" style="display: none;">
        <div class="game-container">
            <!-- Top Utility Bar -->
            <div class="top-utility-bar">
                <button id="exit-btn" class="util-btn">Exit</button>
                <button id="archive-btn" class="util-btn">Archive</button>
            </div>

            <!-- In-Game Logo Header -->
            <div class="header-section">
                <h1 class="logo-title">11FL?</h1>
                <p class="logo-subtitle">Eleventh Floor</p>
                <p class="logo-sub-bottom">Word Climb</p>
            </div>

            <!-- Main Game Board Card -->
            <div class="game-card">
                <div id="card-floor-text">FLOOR 01</div>
                
                <div id="target-word-slots" class="target-slots-container">
                    <!-- Slots rendered dynamically -->
                </div>

                <div id="guess-display">
                    <!-- Guess display -->
                </div>

                <div id="message-box"></div>

                <div id="wheel-wrapper">
                    <div id="wheel-container">
                        <!-- Wheel rendered dynamically -->
                    </div>
                </div>
            </div>

            <!-- Bottom Action Buttons -->
            <div class="action-buttons-container">
                <button id="action-delete-btn" class="action-btn">Delete</button>
                <button id="action-submit-btn" class="action-btn">Submit</button>
            </div>
        </div>
    </div>

    <script src="word-climb.js"></script>
</body>
</html>
