<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11th Floor — Daily Arcade Climb</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div id="app" class="app-container">
    <header class="app-header">
      <div class="brand">11TH FLOOR</div>
      <div id="floor-counter" class="floor-counter">FLOOR 01 / 10</div>
    </header>

    <main id="game-view" class="game-view">
      <!-- Dynamically injected via script.js -->
    </main>
  </div>

  <!-- Stats Modal -->
  <div id="stats-modal" class="modal hidden">
    <div class="modal-content">
      <h3>Climb Statistics</h3>
      <div id="stats-body"></div>
      <button class="secondary-btn" onclick="closeStatsModal()">Close</button>
    </div>
  </div>

  <script src="./script.js"></script>
</body>
</html>
