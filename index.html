<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Puzzles — Daily Elevator Games</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@700;800&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --text-primary: #ffffff;
            --text-muted: #888888;
            
            --genre-terrace: #84CC16;
            --genre-terrace-glow: rgba(132, 204, 22, 0.3);
            
            --genre-magenta: #CC007E;
            --genre-magenta-glow: rgba(204, 0, 126, 0.3);
            
            --genre-gold: #D4AF37;
            --genre-gold-glow: rgba(212, 175, 55, 0.3);
            
            --genre-blue: #3B82F6;
            --genre-blue-glow: rgba(59, 130, 246, 0.3);
            
            --genre-orange: #F97316;
            --genre-orange-glow: rgba(249, 115, 22, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 16px 12px;
            overflow-x: hidden;
        }

        .lobby-header {
            text-align: center;
            margin-top: 10px;
            margin-bottom: 20px;
        }

        .lobby-main-title {
            font-family: 'Anton', sans-serif;
            font-size: 3.6rem;
            color: #ffffff;
            line-height: 0.9;
            letter-spacing: -1px;
            margin-bottom: 6px;
        }

        .lobby-sub-title {
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .lobby-grid {
            width: 100%;
            max-width: 500px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            flex-grow: 1;
            justify-content: center;
        }

        .game-card {
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 12px;
            padding: 16px 20px;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .card-left {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .card-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .card-desc {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .card-badge {
            font-family: 'Anton', sans-serif;
            font-size: 1.2rem;
            padding: 4px 10px;
            border-radius: 6px;
            background: #111111;
            border: 1px solid var(--surface-border);
        }

        /* 1ST: Terrace Test (Pitch Green) */
        .card-terrace { border-color: rgba(132, 204, 22, 0.3); }
        .card-terrace:hover {
            border-color: var(--genre-terrace);
            box-shadow: 0 0 16px var(--genre-terrace-glow);
            transform: translateY(-2px);
        }
        .card-terrace .card-title, .card-terrace .card-badge { color: var(--genre-terrace); }

        /* 2ND: Cluegram (Magenta) */
        .card-cluegram { border-color: rgba(204, 0, 126, 0.3); }
        .card-cluegram:hover {
            border-color: var(--genre-magenta);
            box-shadow: 0 0 16px var(--genre-magenta-glow);
            transform: translateY(-2px);
        }
        .card-cluegram .card-title, .card-cluegram .card-badge { color: var(--genre-magenta); }

        /* 3RD: Questions (Metallic Gold) */
        .card-questions { border-color: rgba(212, 175, 55, 0.3); }
        .card-questions:hover {
            border-color: var(--genre-gold);
            box-shadow: 0 0 16px var(--genre-gold-glow);
            transform: translateY(-2px);
        }
        .card-questions .card-title, .card-questions .card-badge { color: var(--genre-gold); }

        /* 4TH: Word Climb (Blue) */
        .card-wordclimb { border-color: rgba(59, 130, 246, 0.3); }
        .card-wordclimb:hover {
            border-color: var(--genre-blue);
            box-shadow: 0 0 16px var(--genre-blue-glow);
            transform: translateY(-2px);
        }
        .card-wordclimb .card-title, .card-wordclimb .card-badge { color: var(--genre-blue); }

        /* 5TH: Clusters (Orange) */
        .card-clusters { border-color: rgba(249, 115, 22, 0.3); }
        .card-clusters:hover {
            border-color: var(--genre-orange);
            box-shadow: 0 0 16px var(--genre-orange-glow);
            transform: translateY(-2px);
        }
        .card-clusters .card-title, .card-clusters .card-badge { color: var(--genre-orange); }

        footer {
            margin-top: 20px;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            text-align: center;
        }
    </style>
</head>
<body>

    <header class="lobby-header">
        <h1 class="lobby-main-title">11th FLOOR</h1>
        <p class="lobby-sub-title">Daily Elevator Puzzles</p>
    </header>

    <main class="lobby-grid">
        <!-- 1ST: TERRACE TEST -->
        <a href="terrace-test.html" class="game-card card-terrace">
            <div class="card-left">
                <div class="card-title">Terrace Test</div>
                <div class="card-desc">Daily Premier League Trivia</div>
            </div>
            <div class="card-badge">01</div>
        </a>

        <!-- 2ND: CLUEGRAM -->
        <a href="cluegram.html" class="game-card card-cluegram">
            <div class="card-left">
                <div class="card-title">Cluegram</div>
                <div class="card-desc">Clued Anagram Ascent</div>
            </div>
            <div class="card-badge">02</div>
        </a>

        <!-- 3RD: QUESTIONS -->
        <a href="questions.html" class="game-card card-questions">
            <div class="card-left">
                <div class="card-title">Questions</div>
                <div class="card-desc">Daily High-Stakes Trivia</div>
            </div>
            <div class="card-badge">03</div>
        </a>

        <!-- 4TH: WORD CLIMB -->
        <a href="word-climb.html" class="game-card card-wordclimb">
            <div class="card-left">
                <div class="card-title">Word Climb</div>
                <div class="card-desc">9-Letter Wheel Challenge</div>
            </div>
            <div class="card-badge">04</div>
        </a>

        <!-- 5TH: CLUSTERS -->
        <a href="clusters.html" class="game-card card-clusters">
            <div class="card-left">
                <div class="card-title">Clusters</div>
                <div class="card-desc">Category Grouping Puzzle</div>
            </div>
            <div class="card-badge">05</div>
        </a>
    </main>

    <footer>
        ONE MISTAKE RESETS THE CLIMB TO GROUND FLOOR.
    </footer>

</body>
</html>
