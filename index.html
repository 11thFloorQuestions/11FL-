<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11FL?</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  
  <!-- LANDING SCREEN -->
  <div id="landing-screen" class="app-screen">
    <div class="landing-content">
      <div class="landing-logo-title">11FL?</div>
      <div class="landing-logo-subtitle">ELEVATOR TRIVIA CLIMB</div>
      <div class="landing-logo-sub-bottom">WORD CLIMB</div>
      
      <div class="game-select-container">
        <div class="game-card-btn active-game" id="goto-wordclimb-btn" style="cursor: pointer;">
          <div class="game-num">GAME 01</div>
          <div class="game-name">WORD CLIMB</div>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME SCREEN -->
  <div id="game-screen" class="app-screen" style="display: none;">
    <div class="game-container">
      
      <div class="top-utility-bar">
        <button class="util-btn" id="exit-btn">✕ EXIT</button>
        <button class="util-btn btn-audio-toggle">SOUND: OFF</button>
      </div>

      <div class="header-section">
        <div class="logo-title">11FL?</div>
        <div class="logo-subtitle">ELEVATOR TRIVIA CLIMB</div>
        <div class="logo-sub-bottom">WORD CLIMB</div>
      </div>

      <div class="game-card">
        <div id="card-floor-text">FLOOR 01</div>
        
        <div class="target-slots-container" id="target-word-slots"></div>

        <div id="message-box"></div>

        <div id="guess-display"></div>

        <div id="wheel-wrapper">
          <div id="wheel-container"></div>
        </div>
      </div>

      <div class="action-buttons-container">
        <button class="action-btn" id="action-delete-btn">DELETE</button>
        <button class="action-btn" id="action-submit-btn">SUBMIT</button>
      </div>

    </div>
  </div>

  <script src="./word-climb.js"></script>
</body>
</html>
