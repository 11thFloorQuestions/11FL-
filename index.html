<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Word Climb</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Top Utility Bar: Exit & Future Archive Button -->
        <div class="top-utility-bar">
            <button id="exit-btn" class="util-btn">Exit</button>
            <button id="archive-btn" class="util-btn">Archive</button>
        </div>

        <!-- Centered, Un-squashed Logo Section -->
        <div class="header-section">
            <h1 class="logo-title">11FL?</h1>
            <p class="logo-subtitle">Eleventh Floor Word Climb</p>
        </div>

        <!-- Main Game Board Card -->
        <div class="game-card">
            <div id="card-floor-text">FLOOR 01</div>
            
            <div id="target-word-slots" class="target-slots-container">
                <!-- Word length slots rendered dynamically -->
            </div>

            <div id="guess-display">
                <!-- Active typing display -->
            </div>

            <div id="message-box"></div>

            <div id="wheel-wrapper">
                <div id="wheel-container">
                    <!-- Letter wheel buttons rendered dynamically -->
                </div>
            </div>
        </div>

        <!-- Bottom Action Buttons -->
        <div class="action-buttons-container">
            <button id="action-delete-btn" class="action-btn">Delete</button>
            <button id="action-submit-btn" class="action-btn">Submit</button>
        </div>
    </div>

    <script src="word-climb.js"></script>
</body>
</html>
