<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11FL?</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <!-- LANDING HUB SCREEN -->
  <div id="landing-screen" class="app-screen" style="display: flex;">
    <div class="landing-content">
      <div class="landing-logo-title">11FL?</div>
      <div class="landing-logo-subtitle">ELEVATOR TRIVIA CLIMB</div>
      <div class="landing-logo-sub-bottom">GAME HUB</div>
      
      <div class="game-select-container">
        <!-- GAME 01: WORD CLIMB -->
        <div class="game-card-btn active-game" id="goto-wordclimb-btn" style="cursor: pointer;">
          <div class="game-num">GAME 01</div>
          <div class="game-name">WORD CLIMB</div>
        </div>

        <!-- GAME 02: 11TH FLOOR QUESTIONS -->
        <div class="game-card-btn" id="goto-questions-btn" style="cursor: pointer;">
          <div class="game-num">GAME 02</div>
          <div class="game-name">11TH FLOOR QUESTIONS</div>
        </div>
      </div>
    </div>
  </div>

  <!-- GAME 01 SCREEN: WORD CLIMB -->
  <div id="game-screen" class="app-screen" style="display: none;">
    <div class="game-container">
      
      <div class="top-utility-bar">
        <button class="util-btn exit-btn">✕ LOBBY</button>
        <button class="util-btn btn-audio-toggle">SOUND: OFF</button>
      </div>

      <div class="header-section">
        <div class="logo-title">11FL?</div>
        <div class="logo-subtitle">ELEVATOR TRIVIA CLIMB</div>
        <div class="logo-sub-bottom">WORD CLIMB</div>
      </div>

      <div class="game-card">
        <div id="card-floor-text">FLOOR 01</div>
        
        <div class="target-slots-container" id="target-word-slots"></div>

        <div id="message-box"></div>

        <div id="guess-display"></div>

        <div id="wheel-wrapper">
          <div id="wheel-container"></div>
        </div>
      </div>

      <div class="action-buttons-container">
        <button class="action-btn" id="action-delete-btn">DELETE</button>
        <button class="action-btn" id="action-submit-btn">SUBMIT</button>
      </div>

    </div>
  </div>

  <!-- GAME 02 SCREEN: QUESTIONS / TRIVIA -->
  <div id="questions-screen" class="app-screen" style="display: none;">
    <div class="game-container">
      
      <div class="top-utility-bar">
        <button class="util-btn exit-btn">✕ LOBBY</button>
        <button class="util-btn btn-audio-toggle">SOUND: OFF</button>
      </div>

      <div class="header-section">
        <div class="logo-title">11FL?</div>
        <div class="logo-subtitle">ELEVATOR TRIVIA CLIMB</div>
        <div class="logo-sub-bottom">QUESTIONS & VAULT</div>
      </div>

      <div class="game-card">
        <div id="card-floor-text">TRIVIA VAULT</div>
        <div id="message-box" style="margin-top: 20px; font-size: 1rem;">11th Floor Questions Mode</div>
      </div>

    </div>
  </div>

  <!-- MAIN GAME LOGIC -->
  <script src="./word-climb.js"></script>

  <!-- SCREEN NAVIGATION CONTROLLER -->
  <script>
    function showScreen(screenId) {
      document.querySelectorAll('.app-screen').forEach(function(screen) {
        screen.style.display = 'none';
      });
      var target = document.getElementById(screenId);
      if (target) {
        target.style.display = 'flex';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      var wordClimbBtn = document.getElementById('goto-wordclimb-btn');
      var questionsBtn = document.getElementById('goto-questions-btn');
      var exitBtns = document.querySelectorAll('.exit-btn');

      if (wordClimbBtn) {
        wordClimbBtn.addEventListener('click', function() {
          showScreen('game-screen');
        });
      }

      if (questionsBtn) {
        questionsBtn.addEventListener('click', function() {
          showScreen('questions-screen');
        });
      }

      exitBtns.forEach(function(btn) {
        btn.addEventListener('click', function() {
          showScreen('landing-screen');
        });
      });
    });
  </script>
</body>
</html>
