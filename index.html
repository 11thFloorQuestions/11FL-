<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11FL?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-black: #080808;
      --accent-red: #E50914;
      --text-white: #FFFFFF;
      --text-muted: #737373;
      --correct-green: #2e7d32;
      --wrong-red: #c62828;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body, html { width: 100%; height: 100%; background-color: var(--bg-black); color: var(--text-white); overflow: hidden; }
    .app-viewport { width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding: 16px 20px; }
    .screen { display: none; width: 100%; max-width: 400px; height: 100%; max-height: 720px; flex-direction: column; justify-content: space-between; align-items: center; text-align: center; overflow: hidden; }
    .screen.active { display: flex; }
    
    .top-bar-controls { width: 100%; display: flex; justify-content: space-between; align-items: center; height: 28px; flex-shrink: 0; margin-bottom: 4px; }
    .btn-audio-toggle, .btn-archive-toggle { background: transparent; border: 1px solid #262626; color: var(--text-muted); border-radius: 50px; padding: 4px 10px; font-size: 0.60rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-audio-toggle.active { color: var(--accent-red); border-color: var(--accent-red); }
  
    .brand-header { margin-top: 2px; flex-shrink: 0; text-align: center; }
    .logo-header { color: var(--accent-red); font-size: 2.3rem; font-weight: 800; line-height: 1; letter-spacing: -1px; }
    .logo-subtitle { font-size: 0.75rem; font-weight: 500; color: var(--text-white); letter-spacing: 2.5px; text-transform: uppercase; margin-top: 6px; }
    .logo-micro { font-size: 0.55rem; font-weight: 500; color: var(--text-muted); letter-spacing: 3.5px; text-transform: uppercase; margin-top: 3px; }
  
    .game-main-content { width: 100%; flex: 1; display: flex; flex-direction: row; align-items: stretch; gap: 14px; margin: 16px 0; overflow: hidden; min-height: 0; }
    
    .building-tower-col { display: flex; flex-direction: column; align-items: center; justify-content: stretch; flex-shrink: 0; height: 100%; }
    .building-container-side { width: 28px; height: 100%; border: 1px solid #262626; border-radius: 4px; display: flex; flex-direction: column-reverse; padding: 3px; gap: 3px; background: #000; flex: 1; }
    .building-container-center { width: 48px; height: 150px; border: 1px solid #262626; border-radius: 4px; display: flex; flex-direction: column-reverse; padding: 3px; gap: 3px; background: #000; margin: 16px auto; }
    
    .floor-block { flex: 1; background-color: #141414; border-radius: 1px; width: 100%; }
    .floor-block.completed { background-color: #262626; }
    .floor-block.active-floor { background-color: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); }
    
    .lift-cabin-frame { flex: 1; border: 1px solid #262626; border-radius: 8px; background: #0c0c0c; display: flex; flex-direction: column; justify-content: space-between; padding: 14px; overflow: hidden; min-height: 0; }
    .cabin-hud-header { display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 8px; flex-shrink: 0; }
    .hud-lift-banner { color: var(--accent-red); font-size: 0.65rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }
    
    .timer-wrapper { width: 100%; background: #1f1f1f; height: 2px; border-radius: 2px; overflow: hidden; margin-bottom: 12px; flex-shrink: 0; }
    .timer-bar { width: 100%; height: 100%; background: var(--accent-red); transition: width 1s linear; }
    
    .question-box { font-size: 1.15rem; font-weight: 700; width: 100%; line-height: 1.4; text-align: left; color: #f5f5f5; margin-bottom: 16px; flex-shrink: 0; }
    .options-grid { width: 100%; display: flex; flex-direction: column; gap: 8px; flex-shrink: 0; }
    
    .btn-option { background: #141414; color: #fff; border: 1px solid #262626; border-radius: 50px; padding: 12px 18px; font-size: 0.95rem; font-weight: 700; cursor: pointer; width: 100%; text-align: left; transition: border-color 0.15s; white-space: normal; line-height: 1.25; }
    .btn-option:active { border-color: #555; }
    .btn-option.selected-correct { background-color: var(--correct-green) !important; border-color: var(--correct-green) !important; color: #fff !important; }
    .btn-option.selected-wrong { background-color: var(--wrong-red) !important; border-color: var(--wrong-red) !important; color: #fff !important; }
    
    .btn-pill { background: #fff; color: #000; border: none; border-radius: 50px; padding: 12px 32px; font-size: 0.88rem; font-weight: 800; cursor: pointer; flex-shrink: 0; }
    .secondary-btn { background: transparent; color: var(--text-muted); border: 1px solid #262626; border-radius: 50px; padding: 10px 24px; font-size: 0.75rem; font-weight: 700; cursor: pointer; margin-top: 8px; }
    
    .centered-stage { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; width: 100%; min-height: 0; padding: 0 10px; }
    .headline { font-size: 0.82rem; font-weight: 500; line-height: 1.6; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text-muted); white-space: pre-line; text-align: center; }
    .subtext { color: var(--text-muted); font-size: 0.78rem; margin-top: 6px; text-align: center; }
    .archive-content { width: 100%; flex: 1; overflow-y: auto; text-align: left; font-size: 0.78rem; color: var(--text-muted); line-height: 1.6; margin: 16px 0; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
<div class="app-viewport">
  
  <!-- LANDING -->
  <div id="screen-landing" class="screen active">
    <div class="top-bar-controls">
      <button class="btn-archive-toggle" onclick="openArchiveModal()">STATS / ARCHIVE</button>
      <button id="audio-toggle-btn" class="btn-audio-toggle" onclick="toggleAudio()">SOUND: OFF</button>
    </div>
    <div class="brand-header">
      <div class="logo-header">11FL?</div>
      <div class="logo-subtitle">Eleventh Floor</div>
      <div class="logo-micro">Questions</div>
    </div>
    <div class="building-container-center" id="building-landing"></div>
    <div class="centered-stage">
      <div class="headline">Can you reach the 11th Floor? Fail and you're back to the ground floor.</div>
      <button class="btn-pill" style="margin-top: 24px;" onclick="startClimb()">Start Climb</button>
    </div>
    <div></div>
  </div>

  <!-- ARCHIVE / STATS MODAL -->
  <div id="stats-modal" class="screen hidden" style="background: var(--bg-black); position: absolute; top:0; left:0; z-index:10; padding: 16px 20px;">
    <div class="top-bar-controls">
      <button class="btn-archive-toggle" onclick="closeStatsModal()">← Back</button>
      <div></div>
    </div>
    <div class="brand-header">
      <div class="logo-header">11FL?</div>
      <div class="logo-subtitle">Career Telemetry</div>
    </div>
    <div class="archive-content" id="stats-body">Loading stats...</div>
    <button class="secondary-btn" onclick="closeStatsModal()">Return to Landing</button>
  </div>

  <!-- GAME LOOP -->
  <div id="screen-game" class="screen">
    <div class="top-bar-controls">
      <button class="btn-audio-toggle" onclick="resetToLobby()">Exit</button>
      <button id="audio-toggle-btn-game" class="btn-audio-toggle" onclick="toggleAudio()">SOUND: OFF</button>
    </div>
    <div class="brand-header">
      <div class="logo-header">11FL?</div>
      <div class="logo-subtitle">Eleventh Floor</div>
      <div class="logo-micro">Questions</div>
    </div>
    <div class="game-main-content">
      <div class="building-tower-col">
        <div class="building-container-side" id="floor-counter"></div>
      </div>
      <div class="lift-cabin-frame">
        <div class="cabin-hud-header">
          <div class="hud-lift-banner" id="hud-floor-label">FLOOR 01</div>
        </div>
        <div class="timer-wrapper"><div id="timer-bar" class="timer-bar"></div></div>
        <div style="flex:1; display:flex; flex-direction:column; overflow:hidden;" id="game-view">
          <!-- Dynamically rendered floor questions -->
        </div>
      </div>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
