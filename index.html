<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11th Floor Games</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body class="lobby-body">

  <div class="lobby-container">
    <!-- UMBRELLA HEADER -->
    <header class="lobby-header">
      <h1 class="suite-title">11TH FLOOR GAMES</h1>
      <p class="suite-tagline">Elevator Puzzle & Trivia Suite</p>
      <div class="streak-badge lobby-streak">
        <span class="flame-icon">🔥</span>
        <span id="streak-count">0</span>
        <span class="streak-label">DAY STREAK</span>
      </div>
    </header>

    <!-- GAME LAUNCHER CARDS -->
    <main class="games-grid">
      
      <!-- 11th Floor Questions Card -->
      <a href="questions.html" class="game-card">
        <div class="card-icon">🏢</div>
        <div class="card-info">
          <h2>11th Floor Questions</h2>
          <p>10-Floor Daily Trivia Elevator</p>
        </div>
        <div class="card-arrow">→</div>
      </a>

      <!-- 11th Floor Word Climb Card -->
      <a href="word-climb.html" class="game-card">
        <div class="card-icon">🪜</div>
        <div class="card-info">
          <h2>11th Floor Word Climb</h2>
          <p>9-Letter Daily Word Elevator</p>
        </div>
        <div class="card-arrow">→</div>
      </a>

    </main>
  </div>

</body>
</html>
