<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>11FL? Word Climb</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* Mobile viewport fix */
      overflow: hidden;
    }

    /* --- Top Branding Header (11FL? Style) --- */
    header {
      text-align: center;
      padding: 12px 10px 8px;
      background: #1a1a1a;
      border-bottom: 2px solid #d4af37;
      flex-shrink: 0;
    }

    .logo-title {
      font-size: 26px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #d4af37;
      text-transform: uppercase;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #aaaaaa;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .floor-indicator {
      margin-top: 6px;
      font-size: 14px;
      font-weight: 700;
      color: #d4af37;
      letter-spacing: 1px;
    }

    /* --- Central Game Area --- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 10px;
      position: relative;
    }

    #message-box {
      min-height: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #d4af37;
      text-align: center;
    }

    #guess-display {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
    }

    #wheel-container {
      position: relative;
      width: 240px;
      height: 240px;
      margin: 0 auto;
    }

    /* --- Bottom Fixed Control Bar --- */
    footer {
      padding: 12px 16px;
      background: #1a1a1a;
      border-top: 1px solid #333333;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .control-btn {
      flex: 1;
      max-width: 160px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 700;
      color: #d4af37;
      background-color: #222222;
      border: 2px solid #d4af37;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s ease;
    }

    .control-btn:active {
      background-color: #d4af37;
      color: #121212;
    }
  </style>
</head>
<body>

  <!-- Branding Header -->
  <header>
    <div class="logo-title">11FL?</div>
    <div class="subtitle">Word Climb</div>
    <div class="floor-indicator" id="floor-display">FLOOR 4 (4 LETTERS)</div>
  </header>

  <!-- Game Play Area -->
  <main>
    <div id="message-box"></div>
    <div id="guess-display"></div>
    <div id="wheel-container"></div>
  </main>

  <!-- Bottom Control Bar -->
  <footer>
    <button id="action-delete-btn" class="control-btn">⌫ DELETE</button>
    <button id="action-submit-btn" class="control-btn">↵ SUBMIT</button>
  </footer>

  <script src="word-climb.js"></script>
</body>
</html>
