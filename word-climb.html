<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>11th Floor Word Climb — Daily Puzzle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --accent-red: #ff1f2d;
            --accent-red-glow: rgba(255, 31, 45, 0.25);
            --accent-green: #22c55e;
            --accent-green-glow: rgba(34, 197, 94, 0.3);
            --text-primary: #ffffff;
            --text-muted: #888888;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            overflow-x: hidden;
        }

        .app-wrapper {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            flex-grow: 1;
        }

        /* Top Navigation Bar */
        .top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .pill-btn {
            background: transparent;
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 6px 14px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .pill-btn:hover {
            border-color: var(--text-muted);
            background: var(--surface);
        }

        /* Branding Logo Box */
        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 10px;
            text-align: center;
        }

        .game-logo-red {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--accent-red);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 31, 45, 0.35);
            margin-bottom: 4px;
        }

        .game-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .game-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Landing Screen Container */
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 16px;
            padding: 20px 16px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            margin-top: 10px;
        }

        /* Wider Landing Building Graphic (52px) */
        .landing-shaft-graphic {
            display: flex;
            flex-direction: column;
            width: 52px;
            height: 150px;
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 6px;
            gap: 3px;
            background-color: var(--surface);
        }

        .landing-shaft-box {
            flex: 1;
            background-color: #111111;
            border: 1px solid var(--surface-border);
            border-radius: 2px;
            animation: sweepMiddle 1.2s ease-in-out forwards;
        }

        /* Sequential Upward Light Sweep + Top Green Hold + Drop to Floor 01 */
        .landing-shaft-graphic .landing-shaft-box:nth-child(11) { animation: sweepBottomSettle 2.6s ease-in-out forwards; animation-delay: 0.05s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(10) { animation-delay: 0.15s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(9)  { animation-delay: 0.25s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(8)  { animation-delay: 0.35s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(7)  { animation-delay: 0.45s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(6)  { animation-delay: 0.55s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(5)  { animation-delay: 0.65s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(4)  { animation-delay: 0.75s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(3)  { animation-delay: 0.85s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(2)  { animation-delay: 0.95s; }
        .landing-shaft-graphic .landing-shaft-box:nth-child(1)  { animation: sweepTopGreen 1.6s ease-in-out forwards; animation-delay: 1.05s; }

        @keyframes sweepMiddle {
            0% {
                background-color: #111111;
                border-color: var(--surface-border);
                box-shadow: none;
            }
            30% {
                background-color: var(--accent-red);
                border-color: var(--accent-red);
                box-shadow: 0 0 10px var(--accent-red-glow);
            }
            60%, 100% {
                background-color: #111111;
                border-color: var(--surface-border);
                box-shadow: none;
            }
        }

        @keyframes sweepTopGreen {
            0% {
                background-color: #111111;
                border-color: var(--surface-border);
                box-shadow: none;
            }
            20% {
                background-color: var(--accent-green);
                border-color: var(--accent-green);
                box-shadow: 0 0 16px var(--accent-green-glow);
            }
            70% {
                background-color: var(--accent-green);
                border-color: var(--accent-green);
                box-shadow: 0 0 16px var(--accent-green-glow);
            }
            100% {
                background-color: #111111;
                border-color: var(--surface-border);
                box-shadow: none;
            }
        }

        @keyframes sweepBottomSettle {
            0% {
                background-color: #111111;
                border-color: var(--surface-border);
                box-shadow: none;
            }
            15% {
                background-color: var(--accent-red);
                border-color: var(--accent-red);
                box-shadow: 0 0 10px var(--accent-red-glow);
            }
            30% {
                background-color: #111111;
                border-color: var(--surface-border);
                box-shadow: none;
            }
            80% {
                background-color: #111111;
                border-color: var(--surface-border);
                box-shadow: none;
            }
            95%, 100% {
                background-color: var(--accent-red);
                border-color: var(--accent-red);
                box-shadow: 0 0 8px var(--accent-red-glow);
            }
        }

        /* Tagline & Rules Typography Style */
        .landing-challenge-text {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            line-height: 1.6;
            letter-spacing: 1px;
            max-width: 320px;
            text-transform: uppercase;
        }

        .landing-challenge-text strong {
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: 1.5px;
        }

        .btn-start {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 12px 36px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        .btn-start:hover {
            background-color: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 4px 25px var(--accent-red-glow);
        }

        /* Side-by-Side HUD Container */
        .hud-sidebar-container {
            width: 100%;
            display: flex;
            align-items: stretch;
            gap: 12px;
            margin-bottom: 10px;
        }

        .tower-stack {
            display: flex;
            flex-direction: column;
            gap: 2px;
            width: 52px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 6px;
            justify-content: space-between;
            flex-shrink: 0;
        }

        .tower-floor {
            height: 7px;
            border: 1px solid var(--surface-border);
            background: #111111;
            transition: all 0.2s ease;
            border-radius: 2px;
        }

        .tower-floor.active {
            border-color: var(--accent-red);
            background: #ff1f2d;
            box-shadow: 0 0 8px var(--accent-red-glow);
        }

        .tower-floor.completed {
            background: #222222;
        }

        .floor-info-box {
            flex-grow: 1;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-floor-display {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .current-floor-display span {
            color: var(--accent-red);
            font-size: 1.25rem;
        }

        .floor-right-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: center;
        }

        .floor-phase-tag {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 6px 12px;
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            border-radius: 4px;
            background: #111111;
        }

        /* Play Card & Gameplay Canvas */
        .play-card {
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex-grow: 1;
            margin-bottom: 10px;
        }

        #message-box {
            min-height: 18px;
            color: var(--accent-red);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            text-align: center;
        }

        #target-word-slots {
            display: flex;
            gap: 6px;
            justify-content: center;
            align-items: center;
            width: 100%;
            min-height: 36px;
            flex-wrap: wrap;
        }

        .target-slot {
            width: 30px;
            height: 36px;
            border: 1px solid var(--surface-border);
            border-radius: 6px;
            background: #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        #guess-display {
            display: flex;
            justify-content: center;
            gap: 4px;
            min-height: 28px;
            align-items: center;
            font-weight: 700;
            font-size: 0.95rem;
            letter-spacing: 2px;
            color: var(--text-primary);
        }

        /* Wheel Container Canvas */
        #wheel-container {
            width: 250px;
            height: 250px;
            position: relative;
            margin: auto 0;
            flex-shrink: 0;
        }

        /* Action Panel Buttons */
        .action-panel {
            width: 100%;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 12px 20px;
            cursor: pointer;
            border: 2px solid var(--accent-red);
            border-radius: 8px;
            transition: all 0.2s ease;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--surface-border);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .btn-primary {
            background: var(--accent-red);
            color: #000000;
            border-color: var(--accent-red);
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--accent-red);
            box-shadow: 0 0 20px var(--accent-red-glow);
        }

        footer {
            width: 100%;
            text-align: center;
            margin-top: 8px;
            font-size: 0.65rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div class="top-bar">
            <a href="index.html" class="pill-btn">← LOBBY</a>
            <button class="pill-btn" id="btn-sound">SOUND: OFF</button>
        </div>

        <div class="game-logo-box">
            <h1 class="game-logo-red">11FL?</h1>
            <p class="game-logo-title">Eleventh Floor</p>
            <p class="game-logo-sub">WORD CLIMB</p>
        </div>

        <!-- Standardized Landing Screen with Animated 52px Building Graphic -->
        <div id="start-screen" class="landing-container">
            <div class="landing-shaft-graphic">
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
                <div class="landing-shaft-box"></div>
            </div>

            <div class="landing-challenge-text">
                <strong>CAN YOU REACH THE 11TH FLOOR?</strong><br><br>
                Find a valid English word on every floor, from 5 to 9 letters.<br><br>
                ONE MISTAKE RESETS THE CLIMB TO FLOOR 01.
            </div>

            <button id="start-climb-btn" class="btn-start">Start Climb</button>
        </div>

        <!-- Gameplay HUD -->
        <div class="hud-sidebar-container" id="floor-hud-container" style="display: none;">
            <div class="tower-stack" id="tower-stack">
                <div class="tower-floor" data-floor="11"></div>
                <div class="tower-floor" data-floor="10"></div>
                <div class="tower-floor" data-floor="9"></div>
                <div class="tower-floor" data-floor="8"></div>
                <div class="tower-floor" data-floor="7"></div>
                <div class="tower-floor" data-floor="6"></div>
                <div class="tower-floor" data-floor="5"></div>
                <div class="tower-floor" data-floor="4"></div>
                <div class="tower-floor" data-floor="3"></div>
                <div class="tower-floor" data-floor="2"></div>
                <div class="tower-floor" data-floor="1"></div>
            </div>

            <div class="floor-info-box">
                <div class="current-floor-display">FLOOR <span id="floor-number-val">01</span></div>
                <div class="floor-right-group">
                    <div class="floor-phase-tag">ASCENT</div>
                </div>
            </div>
        </div>

        <!-- Main Play Card Workspace -->
        <div id="game-workspace" class="play-card" style="display: none;">
            <div id="message-box"></div>
            <div id="target-word-slots"></div>
            <div id="guess-display"></div>
            <div id="wheel-container"></div>
        </div>

        <!-- Action Panel Controls -->
        <div class="action-panel" id="game-controls" style="display: none;">
            <button class="btn btn-secondary" id="action-delete-btn">⌫ DELETE</button>
            <button class="btn btn-primary" id="action-submit-btn">↵ SUBMIT</button>
        </div>

        <footer>
            <div>ONE MISTAKE RESETS THE CLIMB TO FLOOR 01.</div>
        </footer>
    </div>

    <script src="words.js"></script>
    <script src="word-climb.js"></script>
</body>
</html>
