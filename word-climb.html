<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>11FL? Word Climb</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* --- Top Branding Header (Matching Red Theme) --- */
    header {
      text-align: center;
      padding: 12px 10px 8px;
      background: #1a1a1a;
      border-bottom: 2px solid #e50914;
      flex-shrink: 0;
    }

    .logo-title {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
      color: #e50914; /* Match red theme */
      text-transform: uppercase;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 13px;
      font-weight: 600;
      color: #aaaaaa;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* --- Central Game Layout --- */
    .game-container {
      flex: 1;
      display: flex;
      width: 100%;
      max-width: 500px;
      margin: 0 auto;
      overflow: hidden;
    }

    /* --- Left Elevator / Floor Indicator --- */
    .floor-elevator {
      width: 50px;
      background-color: #181818;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column-reverse; /* Floor 4 at bottom, 9 at top */
      justify-content: space-around;
      align-items: center;
      padding: 10px 0;
      flex-shrink: 0;
    }

    .elevator-floor {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: 1px solid #444;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
      color: #777;
      background-color: #111;
      transition: all 0.2s ease;
    }

    .elevator-floor.active {
      border-color: #e50914;
      background-color: #e50914;
      color: #ffffff;
      box-shadow: 0 0 8px rgba(229, 9, 20, 0.6);
    }

    .elevator-floor.passed {
      border-color: #4cd964;
      color: #4cd964;
      background-color: #111;
    }

    /* --- Main Play Area --- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-evenly;
      padding: 10px;
      position: relative;
    }

    #message-box {
      min-height: 20px;
      font-size: 14px;
      font-weight: bold;
      color: #e50914;
      text-align: center;
    }

    #guess-display {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 48px;
    }

    #wheel-container {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto;
    }

    /* --- Bottom Fixed Control Bar --- */
    footer {
      padding: 12px 16px;
      background: #1a1a1a;
      border-top: 1px solid #333333;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-shrink: 0;
    }

    .control-btn {
      flex: 1;
      max-width: 160px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      background-color: #222222;
      border: 2px solid #e50914;
      border-radius: 8px;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.15s ease;
    }

    .control-btn:active {
      background-color: #e50914;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Red Logo Header -->
  <header>
    <div class="logo-title">11FL?</div>
    <div class="subtitle">Word Climb</div>
  </header>

  <div class="game-container">
    <!-- Left Floor Indicator (Elevator Style) -->
    <aside class="floor-elevator">
      <div class="elevator-floor" data-floor="9">F9</div>
      <div class="elevator-floor" data-floor="8">F8</div>
      <div class="elevator-floor" data-floor="7">F7</div>
      <div class="elevator-floor" data-floor="6">F6</div>
      <div class="elevator-floor" data-floor="5">F5</div>
      <div class="elevator-floor" data-floor="4">F4</div>
    </aside>

    <!-- Main Game Play Board -->
    <main>
      <div id="message-box"></div>
      <div id="guess-display"></div>
      <div id="wheel-container"></div>
    </main>
  </div>

  <!-- Bottom Control Bar -->
  <footer>
    <button id="action-delete-btn" class="control-btn">⌫ DELETE</button>
    <button id="action-submit-btn" class="control-btn">↵ SUBMIT</button>
  </footer>

  <script src="word-climb.js"></script>
</body>
</html>
