<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11th Floor Word Climb</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      padding: 10px 16px;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 380px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 0;
    }

    /* Centered Header Bar */
    .top-header {
      display: grid;
      grid-template-columns: 90px 1fr 90px;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
    }
    .pill-btn {
      background: #000000;
      border: 1px solid #222222;
      border-radius: 16px;
      color: #777777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 6px 10px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: inline-block;
    }
    .brand-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .brand-title {
      color: #ff1f2d;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -0.5px;
    }
    .brand-subtitle-main {
      color: #ffffff;
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-top: 4px;
    }
    .brand-subtitle-sub {
      color: #ffffff;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 4px;
      margin-top: 2px;
    }

    /* Landing Screen (Matches 11th Floor Questions UI) */
    .landing-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 20px 0;
    }
    .landing-elevator-shaft {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 60px;
      height: 190px;
      background-color: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 6px;
      padding: 4px;
    }
    .landing-shaft-slot {
      height: 7.5%;
      border: 1px solid #1e1e1e;
      border-radius: 2px;
      background-color: #0a0a0a;
    }
    .landing-tagline {
      color: #888888;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-align: center;
      line-height: 1.6;
      max-width: 280px;
    }
    .btn-start-climb {
      width: 100%;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      padding: 14px 0;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s ease;
    }
    .btn-start-climb:active {
      background-color: #dddddd;
    }

    /* Active Game Workspace */
    .workspace {
      display: flex;
      gap: 8px;
      flex: 1;
      margin: 6px 0;
      min-height: 0;
      align-items: stretch;
    }
    .elevator-shaft {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 24px;
      background-color: #0f0f0f;
      border: 1px solid #1a1a1a;
      border-radius: 12px;
      padding: 4px 2px;
      flex-shrink: 0;
    }
    .elevator-slot {
      height: 7.5%;
      border: 1px solid #222222;
      border-radius: 3px;
      background-color: transparent;
      transition: all 0.2s ease;
    }
    .elevator-slot.active {
      background-color: #ff1f2d;
      border-color: #ff1f2d;
      box-shadow: 0 0 8px rgba(255, 31, 45, 0.6);
    }
    .play-card {
      flex: 1;
      background-color: #111111;
      border: 1px solid #1e1e1e;
      border-radius: 16px;
      padding: 10px 8px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    .card-header {
      width: 100%;
      text-align: left;
      border-bottom: 1px solid #222222;
      padding-bottom: 4px;
      position: relative;
      flex-shrink: 0;
    }
    .card-floor-label {
      color: #ff1f2d;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .card-header-line {
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 70px;
      height: 2px;
      background-color: #ff1f2d;
    }
    #message-box {
      font-size: 10px;
      font-weight: 800;
      min-height: 14px;
      text-align: center;
      flex-shrink: 0;
    }
    #target-word-slots {
      display: flex;
      gap: 4px;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 28px;
      flex-wrap: wrap;
    }
    .target-slot {
      width: 24px;
      height: 28px;
      border: 1px solid #333333;
      border-radius: 4px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      color: #ffffff;
    }
    #guess-display {
      display: flex;
      justify-content: center;
      gap: 4px;
      min-height: 26px;
      align-items: center;
    }
    #wheel-container {
      width: 180px;
      height: 180px;
      position: relative;
      margin: auto 0;
      flex-shrink: 0;
    }
    .controls {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }
    .btn-action {
      flex: 1;
      padding: 10px 8px;
      border-radius: 14px;
      border: 1px solid #ff1f2d;
      background-color: #121212;
      color: #ffffff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 1px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 0 6px rgba(255, 31, 45, 0.25);
    }
    .btn-action:active {
      background-color: #1c1c1c;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="index.html" class="pill-btn">← LOBBY</a>
      <div class="brand-logo">
        <div class="brand-title">11FL?</div>
        <div class="brand-subtitle-main">Eleventh Floor</div>
        <div class="brand-subtitle-sub">WORD CLIMB</div>
      </div>
      <button class="pill-btn">SOUND: OFF</button>
    </div>

    <!-- Landing Screen (Matching Questions UI) -->
    <div id="start-screen" class="landing-card">
      <div class="landing-elevator-shaft">
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
      </div>

      <div class="landing-tagline">
        CAN YOU REACH THE 11TH FLOOR?<br>
        FAIL AND YOU'RE BACK TO THE GROUND FLOOR.
      </div>

      <button id="start-climb-btn" class="btn-start-climb">Start Climb</button>
    </div>

    <!-- Gameplay Workspace (Hidden initially) -->
    <div id="game-workspace" class="workspace" style="display: none;">
      <div class="elevator-shaft">
        <div class="elevator-slot" data-floor="11"></div>
        <div class="elevator-slot" data-floor="10"></div>
        <div class="elevator-slot" data-floor="9"></div>
        <div class="elevator-slot" data-floor="8"></div>
        <div class="elevator-slot" data-floor="7"></div>
        <div class="elevator-slot" data-floor="6"></div>
        <div class="elevator-slot" data-floor="5"></div>
        <div class="elevator-slot" data-floor="4"></div>
        <div class="elevator-slot" data-floor="3"></div>
        <div class="elevator-slot" data-floor="2"></div>
        <div class="elevator-slot" data-floor="1"></div>
      </div>

      <div class="play-card">
        <div class="card-header">
          <span id="card-floor-text" class="card-floor-label">FLOOR 01</span>
          <div class="card-header-line"></div>
        </div>
        <div id="message-box"></div>
        <div id="target-word-slots"></div>
        <div id="guess-display"></div>
        <div id="wheel-container"></div>
      </div>
    </div>

    <!-- Controls (Hidden initially) -->
    <div id="game-controls" class="controls" style="display: none;">
      <button id="action-delete-btn" class="btn-action"><span>⌫</span> DELETE</button>
      <button id="action-submit-btn" class="btn-action"><span>↵</span> SUBMIT</button>
    </div>
  </div>

  <script src="word-climb.js"></script>
</body>
</html>
