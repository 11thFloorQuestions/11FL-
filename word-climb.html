<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>11FL? Word Climb</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #0b0b0b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }

    /* --- Top Utility Bar & Branding Header --- */
    header {
      padding: 12px 16px 16px;
      background: #0b0b0b;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      flex-shrink: 0;
    }

    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: absolute;
      top: 12px;
      padding: 0 16px;
    }

    .pill-btn {
      background: transparent;
      border: 1px solid #333333;
      color: #888888;
      font-size: 11px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      letter-spacing: 0.5px;
      cursor: pointer;
    }

    .brand-logo {
      font-size: 34px;
      font-weight: 900;
      letter-spacing: 1px;
      color: #ff1f2d;
      line-height: 1;
      margin-top: 4px;
    }

    .brand-sub {
      font-size: 11px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 8px;
    }

    .brand-game {
      font-size: 10px;
      font-weight: 600;
      color: #666666;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 3px;
    }

    /* --- Central Game Area --- */
    .game-layout {
      flex: 1;
      display: flex;
      gap: 12px;
      padding: 0 16px 12px;
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
    }

    /* --- Vertical Elevator Shaft (Matches Image) --- */
    .elevator-shaft {
      width: 28px;
      display: flex;
      flex-direction: column-reverse; /* Bottom is Floor 1 */
      gap: 4px;
      padding: 4px;
      border: 1px solid #222222;
      border-radius: 4px;
      background: #0d0d0d;
      flex-shrink: 0;
    }

    .elevator-block {
      flex: 1;
      border: 1px solid #222222;
      border-radius: 2px;
      background-color: transparent;
      transition: background-color 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .elevator-block.active {
      background-color: #ff1f2d;
      border-color: #ff1f2d;
      box-shadow: 0 0 10px rgba(255, 31, 45, 0.6);
    }

    .elevator-block.passed {
      background-color: #a0141e;
      border-color: #a0141e;
    }

    /* --- Main Playing Card Container --- */
    main.play-card {
      flex: 1;
      background: #121212;
      border: 1px solid #222222;
      border-radius: 12px;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      position: relative;
    }

    .card-floor-header {
      width: 100%;
      padding-bottom: 8px;
      border-bottom: 2px solid #222222;
      position: relative;
      margin-bottom: 8px;
    }

    .card-floor-label {
      font-size: 11px;
      font-weight: 800;
      color: #ff1f2d;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .card-floor-line {
      position: absolute;
      bottom: -2px;
      left: 0;
      height: 2px;
      background-color: #ff1f2d;
      width: 45%;
      transition: width 0.3s ease;
    }

    #message-box {
      min-height: 18px;
      font-size: 12px;
      font-weight: 700;
      color: #ff1f2d;
      text-align: center;
      letter-spacing: 0.5px;
    }

    #guess-display {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 44px;
      width: 100%;
    }

    #wheel-container {
      position: relative;
      width: 230px;
      height: 230px;
      margin: 0 auto;
    }

    /* --- Bottom Fixed Control Bar --- */
    footer {
      padding: 12px 16px;
      background: #0b0b0b;
      border-top: 1px solid #1a1a1a;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .control-btn {
      flex: 1;
      max-width: 160px;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 700;
      color: #ffffff;
      background-color: #161616;
      border: 1px solid #333333;
      border-radius: 24px;
      cursor: pointer;
      text-align: center;
      letter-spacing: 0.5px;
      transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .control-btn:active {
      background-color: #ff1f2d;
      border-color: #ff1f2d;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <!-- Branding Header -->
  <header>
    <div class="top-bar">
      <button class="pill-btn">Exit</button>
      <button class="pill-btn">SOUND: OFF</button>
    </div>
    <div class="brand-logo">11FL?</div>
    <div class="brand-sub">ELEVENTH FLOOR</div>
    <div class="brand-game">WORD CLIMB</div>
  </header>

  <!-- Central Game Layout -->
  <div class="game-layout">
    <!-- Continuous Vertical Elevator Shaft (11 Floors) -->
    <aside class="elevator-shaft" id="elevator-shaft">
      <div class="elevator-block" data-floor="11"></div>
      <div class="elevator-block" data-floor="10"></div>
      <div class="elevator-block" data-floor="9"></div>
      <div class="elevator-block" data-floor="8"></div>
      <div class="elevator-block" data-floor="7"></div>
      <div class="elevator-block" data-floor="6"></div>
      <div class="elevator-block" data-floor="5"></div>
      <div class="elevator-block" data-floor="4"></div>
      <div class="elevator-block" data-floor="3"></div>
      <div class="elevator-block" data-floor="2"></div>
      <div class="elevator-block" data-floor="1"></div>
    </aside>

    <!-- Play Card Container -->
    <main class="play-card">
      <div class="card-floor-header">
        <div class="card-floor-label" id="card-floor-text">FLOOR 04</div>
        <div class="card-floor-line" id="card-floor-progress"></div>
      </div>

      <div id="message-box"></div>
      <div id="guess-display"></div>
      <div id="wheel-container"></div>
    </main>
  </div>

  <!-- Bottom Control Bar -->
  <footer>
    <button id="action-delete-btn" class="control-btn">⌫ DELETE</button>
    <button id="action-submit-btn" class="control-btn">↵ SUBMIT</button>
  </footer>

  <script src="word-climb.js"></script>
</body>
</html>
