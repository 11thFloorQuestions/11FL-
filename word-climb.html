<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>11th Floor Word Climb</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      height: 100dvh;
      padding: 10px 16px;
      overflow: hidden;
    }
    .app-container {
      width: 100%;
      max-width: 380px;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 6px 0;
    }

    /* Centered Header Bar */
    .top-header {
      display: grid;
      grid-template-columns: 90px 1fr 90px;
      align-items: center;
      width: 100%;
      flex-shrink: 0;
    }
    .pill-btn {
      background: #000000;
      border: 1px solid #222222;
      border-radius: 16px;
      color: #777777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;
      padding: 6px 10px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
      display: inline-block;
    }
    .brand-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .brand-title {
      color: #ff1f2d;
      font-size: 34px;
      font-weight: 900;
      line-height: 1.0;
      letter-spacing: -0.5px;
    }
    .brand-subtitle-main {
      color: #ffffff;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 2px;
      margin-top: 2px;
    }
    .brand-subtitle-sub {
      color: #777777;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    /* Minimalist Landing Screen */
    .landing-card {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 16px 0;
    }
    .landing-elevator-shaft {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 54px;
      height: 160px;
      background-color: #000000;
      border: 1px solid #1a1a1a;
      border-radius: 8px;
      padding: 4px;
      flex-shrink: 0;
    }
    .landing-shaft-slot {
      height: 7.5%;
      border: 1px solid #1e1e1e;
      border-radius: 2px;
      background-color: #0a0a0a;
    }

    /* Tagline / Rules Text Block */
    .landing-tagline {
      color: #cccccc;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 1.5px;
      text-align: center;
      line-height: 1.7;
      max-width: 320px;
      text-transform: uppercase;
      padding: 0 10px;
    }
    .landing-tagline-highlight {
      color: #ffffff;
      font-weight: 400;
    }

    /* Centered Start Button */
    .btn-start-climb {
      width: 200px;
      background-color: #ffffff;
      color: #000000;
      border: none;
      border-radius: 30px;
      padding: 12px 0;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: background-color 0.2s ease;
    }
    .btn-start-climb:active {
      background-color: #dddddd;
    }

    /* Active Game Workspace */
    .workspace {
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
      margin: 8px 0;
      min-height: 0;
    }

    /* Top Status Section: Elevator Shaft + Floor Header Card */
    .status-row {
      display: flex;
      gap: 10px;
      width: 100%;
      height: 68px;
      flex-shrink: 0;
    }
    .elevator-shaft {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      width: 48px;
      background-color: #111111;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      padding: 4px 5px;
      flex-shrink: 0;
    }
    .elevator-slot {
      height: 6%;
      border-radius: 2px;
      background-color: #1a1a1a;
      transition: all 0.2s ease;
    }
    .elevator-slot.active {
      background-color: #ff1f2d;
      box-shadow: 0 0 6px rgba(255, 31, 45, 0.7);
    }

    /* Floor Status Card */
    .floor-status-card {
      flex: 1;
      background-color: #111111;
      border: 1px solid #1e1e1e;
      border-radius: 10px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-floor-label {
      color: #ffffff;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .badge-ascent-container {
      background: #181818;
      border: 1px solid #262626;
      border-radius: 6px;
      padding: 5px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }
    .badge-ascent-text {
      color: #666666;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: 1.5px;
    }
    .badge-dots {
      display: flex;
      gap: 4px;
    }
    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background-color: #ff1f2d;
    }

    /* Main Gameplay Container */
    .play-card {
      flex: 1;
      background-color: #111111;
      border: 1px solid #1e1e1e;
      border-radius: 14px;
      padding: 12px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
    }
    #message-box {
      font-size: 11px;
      font-weight: 700;
      color: #ff1f2d;
      min-height: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    #target-word-slots {
      display: flex;
      gap: 5px;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 30px;
      flex-wrap: wrap;
    }
    .target-slot {
      width: 26px;
      height: 30px;
      border: 1px solid #2a2a2a;
      border-radius: 4px;
      background: #181818;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 13px;
      color: #ffffff;
    }
    #guess-display {
      display: flex;
      justify-content: center;
      gap: 4px;
      min-height: 28px;
      align-items: center;
    }
    #wheel-container {
      width: 180px;
      height: 180px;
      position: relative;
      margin: auto 0;
      flex-shrink: 0;
    }

    /* Bottom Action Controls */
    .controls {
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }
    .btn-action {
      flex: 1;
      padding: 12px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background-color 0.15s ease;
    }
    .btn-action-delete {
      background-color: #161616;
      border: 1px solid #282828;
      color: #ffffff;
    }
    .btn-action-delete:active {
      background-color: #222222;
    }
    .btn-action-submit {
      background-color: #7f131a;
      border: 1px solid #a31a26;
      color: #ffffff;
    }
    .btn-action-submit:active {
      background-color: #9c1822;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <div class="top-header">
      <a href="index.html" class="pill-btn">← LOBBY</a>
      <div class="brand-logo">
        <div class="brand-title">11FL?</div>
        <div class="brand-subtitle-main">Eleventh Floor</div>
        <div class="brand-subtitle-sub">WORD CLIMB</div>
      </div>
      <button class="pill-btn">SOUND: OFF</button>
    </div>

    <!-- Minimalist Landing Screen -->
    <div id="start-screen" class="landing-card">
      <div class="landing-elevator-shaft">
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
        <div class="landing-shaft-slot"></div>
      </div>

      <div class="landing-tagline">
        <span class="landing-tagline-highlight">CAN YOU REACH THE 11TH FLOOR?</span><br>
        Find a valid English word on every floor, from 5 to 9 letters. Reusing letters is allowed.<br>
        Submit one wrong and you're back to the ground floor.
      </div>

      <button id="start-climb-btn" class="btn-start-climb">Start Climb</button>
    </div>

    <!-- Gameplay Workspace (Hidden initially) -->
    <div id="game-workspace" class="workspace" style="display: none;">
      
      <!-- Top Status Row: Compact Elevator Shaft + Floor Status Card -->
      <div class="status-row">
        <div class="elevator-shaft">
          <div class="elevator-slot" data-floor="11"></div>
          <div class="elevator-slot" data-floor="10"></div>
          <div class="elevator-slot" data-floor="9"></div>
          <div class="elevator-slot" data-floor="8"></div>
          <div class="elevator-slot" data-floor="7"></div>
          <div class="elevator-slot" data-floor="6"></div>
          <div class="elevator-slot" data-floor="5"></div>
          <div class="elevator-slot" data-floor="4"></div>
          <div class="elevator-slot" data-floor="3"></div>
          <div class="elevator-slot" data-floor="2"></div>
          <div class="elevator-slot" data-floor="1"></div>
        </div>

        <div class="floor-status-card">
          <span id="card-floor-text" class="card-floor-label">FLOOR 01</span>
          <div class="badge-ascent-container">
            <span class="badge-ascent-text">ASCENT</span>
            <div class="badge-dots">
              <span class="dot"></span>
              <span class="dot"></span>
              <span class="dot"></span>
            </div>
          </div>
        </div>
      </div>

      <!-- Main Game Play Area -->
      <div class="play-card">
        <div id="message-box"></div>
        <div id="target-word-slots"></div>
        <div id="guess-display"></div>
        <div id="wheel-container"></div>
      </div>
    </div>

    <!-- Controls (Hidden initially) -->
    <div id="game-controls" class="controls" style="display: none;">
      <button id="action-delete-btn" class="btn-action btn-action-delete"><span>⌫</span> DELETE</button>
      <button id="action-submit-btn" class="btn-action btn-action-submit"><span>↵</span> SUBMIT</button>
    </div>
  </div>

  <script src="words.js"></script>
  <script src="word-climb.js"></script>
</body>
</html>
