<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11th Floor Clusters — Daily Puzzle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-deep: #000000;
            --surface: #0a0a0a;
            --surface-border: #222222;
            --accent-red: #ff1f2d;
            --accent-red-glow: rgba(255, 31, 45, 0.25);
            --accent-green: #22c55e;
            --accent-green-glow: rgba(34, 197, 94, 0.3);
            --text-primary: #ffffff;
            --text-muted: #888888;
            --tile-bg: #0f0f0f;
            --tile-hover: #1a1a1a;
            --tile-selected-bg: #ff1f2d;
            --tile-selected-text: #000000;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            overflow-x: hidden;
        }

        /* Top Bar with Stats and Sound Pills */
        .top-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .pill-btn {
            background: transparent;
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }

        .pill-btn:hover {
            border-color: var(--text-muted);
            background: var(--surface);
        }

        /* Scaled Locked-In Logo Header */
        .game-logo-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        .game-logo-red {
            font-family: 'Anton', sans-serif;
            font-size: 3.2rem;
            font-weight: 400;
            color: var(--accent-red);
            line-height: 0.85;
            letter-spacing: -1px;
            text-shadow: 0 0 20px rgba(255, 31, 45, 0.35);
            margin-bottom: 4px;
        }

        .game-logo-title {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 1.5px;
            margin-bottom: 2px;
        }

        .game-logo-sub {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.6rem;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 4px;
            text-transform: uppercase;
        }

        /* Side-by-Side HUD Container: Tower on Left, Equal Box on Right */
        .hud-sidebar-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            align-items: stretch;
            gap: 12px;
            margin-bottom: 15px;
        }

        /* Tower Indicator Stack (Left) */
        .tower-stack {
            display: flex;
            flex-direction: column-reverse;
            gap: 2px;
            width: 45px;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 8px;
            justify-content: space-between;
        }

        .tower-floor {
            height: 7px;
            border: 1px solid var(--surface-border);
            background: #111111;
            transition: all 0.2s ease;
            border-radius: 2px;
        }

        .tower-floor.active {
            border-color: var(--accent-red);
            background: rgba(255, 31, 45, 0.3);
            box-shadow: 0 0 6px var(--accent-red-glow);
        }

        /* Floor Info Box (Right - Equal Height to Tower Stack) */
        .floor-info-box {
            flex-grow: 1;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
            padding: 12px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .current-floor-display {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 1px;
        }

        .current-floor-display span {
            color: var(--accent-red);
            font-size: 1.25rem;
        }

        .floor-phase-tag {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            padding: 5px 10px;
            border: 1px solid var(--surface-border);
            color: var(--text-muted);
            border-radius: 4px;
            background: #111111;
        }

        /* Main Game Arena */
        main {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            flex-grow: 1;
            justify-content: center;
        }

        .puzzle-prompt {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 15px;
            text-align: center;
            letter-spacing: 0.5px;
        }

        /* Landing Screen Challenge Text & Start Button */
        .landing-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            gap: 20px;
            padding: 15px;
            width: 100%;
            background: var(--surface);
            border: 1px solid var(--surface-border);
            border-radius: 8px;
        }

        .landing-challenge-text {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            line-height: 1.5;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .btn-start {
            background-color: #ffffff;
            color: #000000;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 14px 40px;
            border-radius: 30px;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
        }

        .btn-start:hover {
            background-color: var(--accent-red);
            color: #ffffff;
            box-shadow: 0 4px 25px var(--accent-red-glow);
            transform: translateY(-2px);
        }

        /* Solved Groups Display Area */
        #solved-groups-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        .solved-group-card {
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--accent-green);
            padding: 10px 14px;
            display: flex;
            flex-direction: column;
            gap: 3px;
            border-radius: 8px;
            box-shadow: 0 0 15px var(--accent-green-glow);
            animation: fadeIn 0.4s ease-in-out;
        }

        .solved-group-category {
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--accent-green);
            font-weight: 700;
        }

        .solved-group-words {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        /* Tile Grid */
        .tile-grid {
            display: grid;
            gap: 10px;
            width: 100%;
            margin-bottom: 20px;
        }

        .grid-warmup {
            grid-template-columns: repeat(2, 1fr);
        }
        .grid-squeeze {
            grid-template-columns: repeat(3, 1fr);
        }
        .grid-wall {
            grid-template-columns: repeat(4, 1fr);
        }

        .cluster-tile {
            background-color: var(--tile-bg);
            border: 1px solid var(--surface-border);
            color: var(--text-primary);
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 16px 8px;
            text-align: center;
            cursor: pointer;
            user-select: none;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 55px;
            letter-spacing: 0.5px;
            border-radius: 8px;
        }

        .cluster-tile:hover {
            background-color: var(--tile-hover);
            border-color: var(--accent-red);
        }

        .cluster-tile.selected {
            background-color: var(--tile-selected-bg);
            color: var(--tile-selected-text);
            border-color: var(--tile-selected-bg);
            box-shadow: 0 0 15px var(--accent-red-glow);
        }

        .cluster-tile.success {
            background-color: var(--accent-green) !important;
            color: #000000 !important;
            border-color: var(--accent-green) !important;
            box-shadow: 0 0 20px var(--accent-green-glow) !important;
        }

        /* Action Control Panel */
        .action-panel {
            width: 100%;
            display: flex;
            gap: 12px;
            justify-content: center;
        }

        .btn {
            font-family: 'Montserrat', sans-serif;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 12px 20px;
            cursor: pointer;
            border: 2px solid var(--accent-red);
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border-color: var(--surface-border);
        }

        .btn-secondary:hover {
            color: var(--text-primary);
            border-color: var(--text-muted);
        }

        .btn-primary {
            background: var(--accent-red);
            color: #000000;
            border-color: var(--accent-red);
        }

        .btn-primary:hover {
            background: transparent;
            color: var(--accent-red);
            box-shadow: 0 0 20px var(--accent-red-glow);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            box-shadow: none !important;
        }

        /* Brutal Penalty Flash Overlay */
        #penalty-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(255, 31, 45, 0.2);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
            z-index: 999;
        }

        #penalty-overlay.flash {
            opacity: 1;
        }

        /* Footer / Message Box */
        footer {
            width: 100%;
            max-width: 600px;
            text-align: center;
            margin-top: 15px;
            font-size: 0.7rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        #status-message {
            min-height: 20px;
            color: var(--accent-red);
            font-weight: 700;
            margin-bottom: 4px;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div id="penalty-overlay"></div>

    <div class="top-bar">
        <a href="index.html" class="pill-btn">← LOBBY</a>
        <button class="pill-btn" id="btn-sound">SOUND: OFF</button>
    </div>

    <div class="game-logo-box">
        <h1 class="game-logo-red">11FL?</h1>
        <p class="game-logo-title">Eleventh Floor</p>
        <p class="game-logo-sub">CLUSTERS</p>
    </div>

    <!-- Side-by-Side HUD Container (Tower Stack on Left, Floor Info Box on Right) -->
    <div class="hud-sidebar-container" id="floor-hud-container">
        <div class="tower-stack" id="tower-stack">
            <!-- Generated dynamically via JS -->
        </div>
        <div class="floor-info-box">
            <div class="current-floor-display">FLOOR <span id="floor-number-val">01</span></div>
            <div class="floor-phase-tag" id="floor-phase-tag">WARMUP PHASE</div>
        </div>
    </div>

    <main>
        <div class="puzzle-prompt" id="puzzle-prompt"></div>

        <!-- Solved groups container -->
        <div id="solved-groups-container"></div>

        <!-- Active interaction grid / Landing View -->
        <div class="tile-grid grid-warmup" id="tile-grid"></div>

        <div class="action-panel" id="action-panel-container" style="display: none;">
            <button class="btn btn-secondary" id="btn-shuffle">SHUFFLE</button>
            <button class="btn btn-primary" id="btn-submit" disabled>SUBMIT</button>
        </div>
    </main>

    <footer>
        <div id="status-message"></div>
        <div>ONE MISTAKE RESETS THE CLIMB TO FLOOR 01.</div>
    </footer>

    <!-- Load Data and Core Game Logic -->
    <script src="clusters-data.js"></script>
    <script src="clusters.js"></script>
</body>
</html>
